name: Deploy isolated Skyline competition service
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: skyline-competition-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require an authorized project connection
        env:
          PROVIDER: ${{ vars.SKYLINE_COMPETITION_WIF_PROVIDER || secrets.SKYLINE_COMPETITION_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.SKYLINE_COMPETITION_SERVICE_ACCOUNT || secrets.SKYLINE_COMPETITION_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER" && test -n "$ACCOUNT" || { echo "::error::Google deployment authorization is not configured (provider set: ${PROVIDER:+yes}, account set: ${ACCOUNT:+yes}). Add repository variables or secrets; never service-account keys."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify isolated server package and natural matches
        run: |
          node skyline-estates/tests/competition-transactions.cjs
          node skyline-estates/tests/competition-service.cjs
          node skyline-estates/tests/competition-match.cjs
          node skyline-estates/tests/lc-engine.cjs
          node skyline-estates/tests/lc-online-service.cjs
          node skyline-estates/tests/lc-test-access.cjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: eko-estates
          workload_identity_provider: ${{ vars.SKYLINE_COMPETITION_WIF_PROVIDER || secrets.SKYLINE_COMPETITION_WIF_PROVIDER }}
          service_account: ${{ vars.SKYLINE_COMPETITION_SERVICE_ACCOUNT || secrets.SKYLINE_COMPETITION_SERVICE_ACCOUNT }}
      - name: Install existing-version runtime dependencies
        run: npm install --prefix skyline-estates/competition-functions --no-audit --no-fund
      - name: Deploy only the isolated competition function
        working-directory: skyline-estates/competition-functions
        run: npx --yes firebase-tools@latest deploy --non-interactive --project eko-estates --config firebase.json --only functions:skyline-competition
      - name: Check public capability endpoint
        run: |
          curl --fail --silent --show-error https://europe-west1-eko-estates.cloudfunctions.net/skylineCompetition/v1/competition/capabilities > "$RUNNER_TEMP/competition-capabilities.json"
          node -e "const x=require(process.env.RUNNER_TEMP+'/competition-capabilities.json');if(x.protocol!==1||x.version!==1||!x.verified||!x.rulesets||x.rulesets.classic.online!==true)process.exit(1);console.log('rulesets',JSON.stringify(x.rulesets))"
          echo 'Service endpoint responds. Web verification remains disabled until authenticated production acceptance passes.'
