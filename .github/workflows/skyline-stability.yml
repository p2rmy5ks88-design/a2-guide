name: Skyline stability tests

on:
  push:
    branches: [skyline-gameplay-ux]
  # Runs on every pull request; the 'changes' job skips the browser suites when no game files changed,
  # and the 'Stability gate' job is the single required check for merging into main.
  pull_request:
  workflow_dispatch:

# Superseded commits should not compete with the release candidate's full browser suite.
concurrency:
  group: skyline-stability-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  changes:
    name: Detect game changes
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.d.outputs.game }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: d
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "game=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          echo "$files"
          if echo "$files" | grep -qE '^(skyline-estates/|skyline-estates-app/|skyline-estates-desktop/|eko-estates/|\.github/workflows/skyline-stability\.yml)'; then echo "game=true" >> "$GITHUB_OUTPUT"; else echo "game=false" >> "$GITHUB_OUTPUT"; fi

  stability:
    name: Core gameplay and menus
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Configure preinstalled Chrome
        run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Check generated offline assets
        run: python3 skyline-estates/build.py --check
      - name: Core gameplay and menus
        run: |
          # Keep the previously audited test commands, but identify failing checks.
          t(){ local log="$RUNNER_TEMP/last-test.log"; local cap=300; case "$1" in *complete-matches.cjs*|*championship-review-browser.cjs*|*security/service/*-browser.test.cjs*) cap=900;; esac; echo "RUNNING: $1"; if ! timeout --signal=TERM --kill-after=10s "${cap}s" bash -c "$1" >"$log" 2>&1; then cat "$log"; msg=$(grep -v '^\s\{3,\}' "$log" | tail -c 3500 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g'); ttl=$(printf %s "${1:0:120}" | sed "s/[:,]/ /g"); echo "::error title=Failed $ttl::$msg"; exit 1; fi; tail -n 3 "$log"; }
          t 'node skyline-estates/security/service/room-entry-browser.test.cjs "$RUNNER_TEMP/skyline-room-entry-browser.json"'
          t 'node skyline-estates/security/service/lobby-browser.test.cjs "$RUNNER_TEMP/skyline-lobby-browser.json"'
          t 'node skyline-estates/tests/accounts-browser.cjs "$RUNNER_TEMP/skyline-accounts-browser.json"'
          t 'node skyline-estates/tests/cloud-sync-browser.cjs'
          t 'node skyline-estates/tests/currency-sc.cjs'
          t 'SKYLINE_SPOT_RUNS=20 node skyline-estates/tests/spotlight-browser.cjs "$RUNNER_TEMP/skyline-spotlight.json"'
          t 'node skyline-estates/tests/debt-portfolio-browser.cjs'
          t 'node skyline-estates/tests/purchase-start-browser.cjs'
          t 'node skyline-estates/tests/no-purchases-browser.cjs'
          t 'node skyline-estates/tests/home-redesign-browser.cjs'
          t 'node skyline-estates/tests/collection-sc.cjs'
          t 'node skyline-estates/tests/collection-vault-browser.cjs'
          t 'node skyline-estates/tests/portfolio-fast-upgrades-browser.cjs'
          t 'node skyline-estates/tests/testflight-hotfix-browser.cjs'
          t 'node skyline-estates/tests/portfolio-integrated-browser.cjs'
          t 'node skyline-estates/tests/gameplay-ux-browser.cjs'
          t 'node skyline-estates/tests/web-presentation-browser.cjs'
          t 'node skyline-estates/tests/native-fullscreen.cjs'
          t 'node skyline-estates/tests/promo-codes.cjs'
          t 'node skyline-estates/tests/promo-browser.cjs'
          t 'node skyline-estates/tests/release-content.cjs'
          t 'SKYLINE_CONTENT_RUNS=5 node skyline-estates/tests/release-content-browser.cjs'
          t 'node skyline-estates/tests/token-mastery.cjs'
          t 'node skyline-estates/tests/ai-styles-browser.cjs'
          t 'node skyline-estates/tests/first-session-browser.cjs'
          t 'node skyline-estates/tests/a11y-layout-browser.cjs'
          t 'node skyline-estates/tests/lifecycle-browser.cjs'
          t 'node skyline-estates/tests/beta-diary-browser.cjs'
          t 'node skyline-estates/tests/landmarks-browser.cjs'
          t 'node skyline-estates/tests/avatars-browser.cjs'
          t 'node skyline-estates/tests/living-city-browser.cjs'
          t 'node skyline-estates/tests/skyline-coach-browser.cjs'
          t 'node skyline-estates/tests/problem-report-browser.cjs'
          t 'node skyline-estates/tests/living-city-parity.cjs 6 2'
          t 'node skyline-estates/tests/lc-engine.cjs'
          t 'node skyline-estates/tests/lc-online-service.cjs'
          t 'node skyline-estates/tests/lc-test-access.cjs'
          t 'node skyline-estates/tests/lc-online-client.cjs'
          t 'node skyline-estates/security/service/property-rarity.test.cjs'
          t 'SKYLINE_NO_WEBGL=1 node skyline-estates/tests/reference-dashboard-browser.cjs "$RUNNER_TEMP/skyline-reference-dashboard.json"'
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-stability-stability
          path: ${{ runner.temp }}/skyline-*
          if-no-files-found: ignore
  management:
    name: Persistent management and trade browser
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Configure preinstalled Chrome
        run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Check generated offline assets
        run: python3 skyline-estates/build.py --check
      - name: Persistent management and trade browser
        run: |
          # Keep the previously audited test commands, but identify failing checks.
          t(){ local log="$RUNNER_TEMP/last-test.log"; local cap=300; case "$1" in *complete-matches.cjs*|*championship-review-browser.cjs*|*security/service/*-browser.test.cjs*) cap=900;; esac; echo "RUNNING: $1"; if ! timeout --signal=TERM --kill-after=10s "${cap}s" bash -c "$1" >"$log" 2>&1; then cat "$log"; msg=$(grep -v '^\s\{3,\}' "$log" | tail -c 3500 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g'); ttl=$(printf %s "${1:0:120}" | sed "s/[:,]/ /g"); echo "::error title=Failed $ttl::$msg"; exit 1; fi; tail -n 3 "$log"; }
          t 'node skyline-estates/security/service/management-browser.test.cjs "$RUNNER_TEMP/skyline-management-browser.json"'
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-stability-management
          path: ${{ runner.temp }}/skyline-*
          if-no-files-found: ignore
  rules_a:
    name: Online game-control and trade parity
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Configure preinstalled Chrome
        run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Check generated offline assets
        run: python3 skyline-estates/build.py --check
      - name: Online game-control and trade parity
        run: |
          # Keep the previously audited test commands, but identify failing checks.
          t(){ local log="$RUNNER_TEMP/last-test.log"; local cap=300; case "$1" in *complete-matches.cjs*|*championship-review-browser.cjs*|*security/service/*-browser.test.cjs*) cap=900;; esac; echo "RUNNING: $1"; if ! timeout --signal=TERM --kill-after=10s "${cap}s" bash -c "$1" >"$log" 2>&1; then cat "$log"; msg=$(grep -v '^\s\{3,\}' "$log" | tail -c 3500 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g'); ttl=$(printf %s "${1:0:120}" | sed "s/[:,]/ /g"); echo "::error title=Failed $ttl::$msg"; exit 1; fi; tail -n 3 "$log"; }
          t 'node skyline-estates/security/service/game-controls-browser.test.cjs "$RUNNER_TEMP/skyline-controls-browser.json"'
          t 'node skyline-estates/security/service/web-connection-browser.test.cjs "$RUNNER_TEMP/skyline-web-connection-browser.json"'
          t 'node skyline-estates/security/service/ai-browser.test.cjs "$RUNNER_TEMP/skyline-ai-browser.json"'
          t 'node skyline-estates/security/service/trade-browser.test.cjs "$RUNNER_TEMP/skyline-trade-browser.json"'
          t 'node skyline-estates/security/service/reroll-browser.test.cjs "$RUNNER_TEMP/skyline-reroll-browser.json"'
          t 'node skyline-estates/security/service/debt-browser.test.cjs "$RUNNER_TEMP/skyline-debt-browser.json"'
          t 'node skyline-estates/security/service/auction-browser.test.cjs "$RUNNER_TEMP/skyline-auction-browser.json"'
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-stability-rules_a
          path: ${{ runner.temp }}/skyline-*
          if-no-files-found: ignore
  rules_b:
    name: Card, turn and asset parity
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Configure preinstalled Chrome
        run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Check generated offline assets
        run: python3 skyline-estates/build.py --check
      - name: Card, turn and asset parity
        run: |
          # Keep the previously audited test commands, but identify failing checks.
          t(){ local log="$RUNNER_TEMP/last-test.log"; local cap=300; case "$1" in *complete-matches.cjs*|*championship-review-browser.cjs*|*security/service/*-browser.test.cjs*) cap=900;; esac; echo "RUNNING: $1"; if ! timeout --signal=TERM --kill-after=10s "${cap}s" bash -c "$1" >"$log" 2>&1; then cat "$log"; msg=$(grep -v '^\s\{3,\}' "$log" | tail -c 3500 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g'); ttl=$(printf %s "${1:0:120}" | sed "s/[:,]/ /g"); echo "::error title=Failed $ttl::$msg"; exit 1; fi; tail -n 3 "$log"; }
          t 'node skyline-estates/security/service/card-browser.test.cjs "$RUNNER_TEMP/skyline-card-browser.json"'
          t 'node skyline-estates/security/service/jail-browser.test.cjs "$RUNNER_TEMP/skyline-jail-browser.json"'
          t 'node skyline-estates/tests/timed-finish.cjs'
          t 'node skyline-estates/tests/championship-score.cjs'
          t 'node skyline-estates/tests/endgame-permits.cjs'
          t 'CHAMP_SPEED=normal node skyline-estates/tests/championship-review-browser.cjs "$RUNNER_TEMP/skyline-championship-review"'
          t 'node skyline-estates/security/service/end-browser.test.cjs "$RUNNER_TEMP/skyline-end-browser.json"'
          t 'node skyline-estates/security/service/turn-browser.test.cjs "$RUNNER_TEMP/skyline-turn-browser.json"'
          t 'node skyline-estates/security/service/setup-browser.test.cjs "$RUNNER_TEMP/skyline-setup-browser.json"'
          t 'node skyline-estates/security/service/asset-browser.test.cjs "$RUNNER_TEMP/skyline-asset-browser.json"'
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-stability-rules_b
          path: ${{ runner.temp }}/skyline-*
          if-no-files-found: ignore
  offline_matches:
    name: Offline recovery and complete matches
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Configure preinstalled Chrome
        run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Check generated offline assets
        run: python3 skyline-estates/build.py --check
      - name: Offline recovery and complete matches
        run: |
          # Keep the previously audited test commands, but identify failing checks.
          t(){ local log="$RUNNER_TEMP/last-test.log"; local cap=300; case "$1" in *complete-matches.cjs*|*championship-review-browser.cjs*|*security/service/*-browser.test.cjs*) cap=900;; esac; echo "RUNNING: $1"; if ! timeout --signal=TERM --kill-after=10s "${cap}s" bash -c "$1" >"$log" 2>&1; then cat "$log"; msg=$(grep -v '^\s\{3,\}' "$log" | tail -c 3500 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g'); ttl=$(printf %s "${1:0:120}" | sed "s/[:,]/ /g"); echo "::error title=Failed $ttl::$msg"; exit 1; fi; tail -n 3 "$log"; }
          t 'node skyline-estates/tests/offline-worker.cjs'
          t 'node skyline-estates/tests/offline-startup.cjs "$RUNNER_TEMP/skyline-offline-startup.json"'
          t 'node skyline-estates/tests/session-lifecycle.cjs'
          t 'node skyline-estates/tests/remote-state.cjs'
          t 'node skyline-estates/tests/online-rooms.cjs'
          t 'node skyline-estates/tests/turn-resume.cjs'
          t 'node skyline-estates/tests/save-recovery.cjs'
          t 'node skyline-estates/tests/complete-matches.cjs "$RUNNER_TEMP/skyline-complete-matches.json"'
          t 'node skyline-estates/tests/human-flows.cjs "$RUNNER_TEMP/skyline-human-flows.json"'
          t 'node skyline-estates/tests/stability.cjs "$RUNNER_TEMP/skyline-phase1.json"'
          t 'node skyline-estates/tests/browser-smoke.cjs "$RUNNER_TEMP/skyline-browser-smoke.json"'
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-stability-offline_matches
          path: ${{ runner.temp }}/skyline-*
          if-no-files-found: ignore

  visual_correction:
    name: Visual geometry (${{ matrix.engine }})
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      VISUAL_ENGINE: ${{ matrix.engine }}
      VISUAL_SAFE: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Configure preinstalled Chrome
        run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Install Safari-engine test browser
        if: matrix.engine == 'webkit'
        run: npx --prefix skyline-estates/tests playwright install --with-deps webkit
      - name: Build and verify the native web bundle
        run: |
          npm install --prefix skyline-estates-app --no-audit --no-fund
          npm run --prefix skyline-estates-app build:web
          node skyline-estates/tests/verify-bundle.cjs skyline-estates-app
          node skyline-estates/tests/coach-native-bundle.cjs
          NATIVE_WWW=skyline-estates-app/www node skyline-estates/tests/performance-budget.cjs
      - name: "Visual: generated assets"
        timeout-minutes: 5
        run: python3 skyline-estates/build.py --check
      - name: "Visual: market-pulse"
        timeout-minutes: 5
        run: node skyline-estates/tests/market-pulse.cjs
      - name: "Visual: showcase-browser"
        timeout-minutes: 5
        run: node skyline-estates/tests/showcase-browser.cjs
      - name: "Visual: challenges-browser"
        timeout-minutes: 5
        run: node skyline-estates/tests/challenges-browser.cjs
      - name: "Visual: cloud-restore"
        timeout-minutes: 5
        run: node skyline-estates/tests/cloud-restore.cjs
      - name: "Visual: native-roadmap-browser"
        timeout-minutes: 5
        run: node skyline-estates/tests/native-roadmap-browser.cjs
      - name: "Visual: collection-vault-browser"
        timeout-minutes: 5
        run: node skyline-estates/tests/collection-vault-browser.cjs
      - name: "Visual: native collection-vault-browser"
        timeout-minutes: 5
        run: COLLECTION_BASE=skyline-estates-app/www node skyline-estates/tests/collection-vault-browser.cjs
      - name: "Visual: testflight-hotfix-browser"
        timeout-minutes: 5
        run: node skyline-estates/tests/testflight-hotfix-browser.cjs
      - name: "Visual: native testflight-hotfix-browser"
        timeout-minutes: 5
        run: HOTFIX_NATIVE=1 node skyline-estates/tests/testflight-hotfix-browser.cjs
      - name: "Visual: social-browser"
        timeout-minutes: 5
        run: node skyline-estates/tests/social-browser.cjs
      - name: "Visual: verified-browser"
        timeout-minutes: 5
        run: node skyline-estates/tests/verified-browser.cjs
      - name: "Visual: competition-transactions"
        timeout-minutes: 5
        run: node skyline-estates/tests/competition-transactions.cjs
      - name: "Visual: competition-service"
        timeout-minutes: 5
        run: node skyline-estates/tests/competition-service.cjs
      - name: "Visual: competition-match"
        timeout-minutes: 5
        run: node skyline-estates/tests/competition-match.cjs
      - name: "Visual: currency-browser"
        timeout-minutes: 5
        run: node skyline-estates/tests/currency-browser.cjs
      - name: "Visual: visual-correction-browser"
        timeout-minutes: 5
        run: node skyline-estates/tests/visual-correction-browser.cjs
      - name: Verify already-published assets on explicit production acceptance
        if: github.event_name == 'workflow_dispatch'
        run: node skyline-estates/tests/published-web.cjs
      - name: Upload before-release visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-visual-${{ matrix.engine }}
          path: |
            ${{ runner.temp }}/native-roadmap-*.png
            ${{ runner.temp }}/native-roadmap-*.json
            ${{ runner.temp }}/hotfix-*.json
            ${{ runner.temp }}/sc-buildings-*.png
            ${{ runner.temp }}/mortgage-*.png
            ${{ runner.temp }}/after-*.png
            ${{ runner.temp }}/after-*.json
            ${{ runner.temp }}/currency-*.png
            ${{ runner.temp }}/currency-*.json
            ${{ runner.temp }}/market-*.png
            ${{ runner.temp }}/market-*.json
            ${{ runner.temp }}/showcase-*.png
            ${{ runner.temp }}/showcase-*.json
            ${{ runner.temp }}/challenges-*.png
            ${{ runner.temp }}/challenges-*.json
            ${{ runner.temp }}/social-*.png
            ${{ runner.temp }}/social-*.json
            ${{ runner.temp }}/verified-*.png
            ${{ runner.temp }}/verified-*.json
            ${{ runner.temp }}/skyline-competition-*.json
          if-no-files-found: ignore

  gate:
    name: Stability gate
    if: always()
    needs: [changes, stability, management, rules_a, rules_b, offline_matches, visual_correction]
    runs-on: ubuntu-latest
    steps:
      - name: All stability suites passed or were not needed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) echo "A required suite did not pass ($r)"; exit 1;; esac; done
          if [ "${{ needs.changes.result }}" != "success" ]; then echo "change detection failed"; exit 1; fi
