name: Skyline stability tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live_currency:
    name: Live SC verification (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      VISUAL_ENGINE: ${{ matrix.engine }}
      CURRENCY_BASE_URL: https://p2rmy5ks88-design.github.io/a2-guide/skyline-estates/
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - if: matrix.engine == 'webkit'
        run: npx --prefix skyline-estates/tests playwright install --with-deps webkit
      - name: Compare actual Pages files with the merged release
        run: |
          node <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto');
          (async()=>{for(const file of ['index.html','web-play.html','web-correction.html','web-follow.html','web-board.html','web-menus.html','lib/skyline-currency.js','lib/skyline-sc-wallet.js','lib/skyline-earned-cash.js','lib/skyline-earned-cash.css','offline-assets.js','sw.js']){
            const r=await fetch(process.env.CURRENCY_BASE_URL+file,{cache:'no-store'});if(!r.ok)throw Error(file+': HTTP '+r.status);
            const actual=Buffer.from(await r.arrayBuffer()),expected=fs.readFileSync('skyline-estates/'+file),hash=b=>crypto.createHash('sha256').update(b).digest('hex');
            if(hash(actual)!==hash(expected))throw Error('Published bytes mismatch: '+file);console.log('PASS live bytes '+file+' '+hash(actual));
          }})().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Upgrade a cached legacy game and wallet with the actual updater page
        run: |
          if [ "$VISUAL_ENGINE" = "webkit" ]; then unset CHROME_PATH; fi
          LIBGL_ALWAYS_SOFTWARE=1 node skyline-estates/tests/legacy-sc-update-check.cjs "$RUNNER_TEMP/legacy-upgrade.json"
      - name: Test actual deployed game in isolated browser storage
        run: node skyline-estates/tests/currency-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-sc-${{ matrix.engine }}
          path: |
            ${{ runner.temp }}/legacy-upgrade.json
            ${{ runner.temp }}/currency-*.png
            ${{ runner.temp }}/currency-*.json
