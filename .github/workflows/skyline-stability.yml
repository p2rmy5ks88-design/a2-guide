name: Skyline stability tests

on:
  pull_request:
    paths:
      - 'skyline-estates/**'
      - '.github/workflows/skyline-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Install Chromium
        run: npx --prefix skyline-estates/tests playwright install --with-deps chromium
      - name: Test saved turns and seeded games
        run: |
          node skyline-estates/tests/turn-resume.cjs
          node skyline-estates/tests/stability.cjs "$RUNNER_TEMP/skyline-phase1.json"
      - name: Upload per-game results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-stability-results
          path: ${{ runner.temp }}/skyline-phase1.json
