name: Skyline stability tests

on:
  pull_request:
    paths:
      - 'skyline-estates/**'
      - '.github/workflows/skyline-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Use preinstalled Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome)"
          "$CHROME_BIN" --version
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Check generated offline assets
        run: python3 skyline-estates/build.py --check
      - name: Test saved turns and seeded games
        run: |
          node skyline-estates/security/service/room-entry-browser.test.cjs "$RUNNER_TEMP/skyline-room-entry-browser.json"
          node skyline-estates/security/service/lobby-browser.test.cjs "$RUNNER_TEMP/skyline-lobby-browser.json"
          node skyline-estates/tests/promo-codes.cjs
          node skyline-estates/tests/promo-browser.cjs
          node skyline-estates/tests/token-mastery.cjs
          node skyline-estates/security/service/property-rarity.test.cjs
          SKYLINE_NO_WEBGL=1 node skyline-estates/tests/reference-dashboard-browser.cjs "$RUNNER_TEMP/skyline-reference-dashboard.json"
          node skyline-estates/security/service/management-browser.test.cjs "$RUNNER_TEMP/skyline-management-browser.json"
          node skyline-estates/security/service/game-controls-browser.test.cjs "$RUNNER_TEMP/skyline-controls-browser.json"
          node skyline-estates/security/service/web-connection-browser.test.cjs "$RUNNER_TEMP/skyline-web-connection-browser.json"
          node skyline-estates/security/service/ai-browser.test.cjs "$RUNNER_TEMP/skyline-ai-browser.json"
          node skyline-estates/security/service/trade-browser.test.cjs "$RUNNER_TEMP/skyline-trade-browser.json"
          node skyline-estates/security/service/reroll-browser.test.cjs "$RUNNER_TEMP/skyline-reroll-browser.json"
          node skyline-estates/security/service/debt-browser.test.cjs "$RUNNER_TEMP/skyline-debt-browser.json"
          node skyline-estates/security/service/auction-browser.test.cjs "$RUNNER_TEMP/skyline-auction-browser.json"
          node skyline-estates/security/service/card-browser.test.cjs "$RUNNER_TEMP/skyline-card-browser.json"
          node skyline-estates/security/service/jail-browser.test.cjs "$RUNNER_TEMP/skyline-jail-browser.json"
          node skyline-estates/tests/timed-finish.cjs
          node skyline-estates/security/service/end-browser.test.cjs "$RUNNER_TEMP/skyline-end-browser.json"
          node skyline-estates/security/service/turn-browser.test.cjs "$RUNNER_TEMP/skyline-turn-browser.json"
          node skyline-estates/security/service/setup-browser.test.cjs "$RUNNER_TEMP/skyline-setup-browser.json"
          node skyline-estates/security/service/asset-browser.test.cjs "$RUNNER_TEMP/skyline-asset-browser.json"
          node skyline-estates/tests/offline-worker.cjs
          node skyline-estates/tests/offline-startup.cjs "$RUNNER_TEMP/skyline-offline-startup.json"
          node skyline-estates/tests/session-lifecycle.cjs
          node skyline-estates/tests/remote-state.cjs
          node skyline-estates/tests/online-rooms.cjs
          node skyline-estates/tests/turn-resume.cjs
          node skyline-estates/tests/save-recovery.cjs
          node skyline-estates/tests/complete-matches.cjs "$RUNNER_TEMP/skyline-complete-matches.json"
          node skyline-estates/tests/human-flows.cjs "$RUNNER_TEMP/skyline-human-flows.json"
          node skyline-estates/tests/stability.cjs "$RUNNER_TEMP/skyline-phase1.json"
          node skyline-estates/tests/browser-smoke.cjs "$RUNNER_TEMP/skyline-browser-smoke.json"
      - name: Upload per-game results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-stability-results
          path: |
            ${{ runner.temp }}/skyline-room-entry-browser.json
            ${{ runner.temp }}/skyline-lobby-browser.json
            ${{ runner.temp }}/skyline-reference-dashboard.json
            ${{ runner.temp }}/skyline-reference-dashboard.*.png
            ${{ runner.temp }}/skyline-management-browser.json
            ${{ runner.temp }}/skyline-controls-browser.json
            ${{ runner.temp }}/skyline-web-connection-browser.json
            ${{ runner.temp }}/skyline-ai-browser.json
            ${{ runner.temp }}/skyline-trade-browser.json
            ${{ runner.temp }}/skyline-reroll-browser.json
            ${{ runner.temp }}/skyline-debt-browser.json
            ${{ runner.temp }}/skyline-auction-browser.json
            ${{ runner.temp }}/skyline-card-browser.json
            ${{ runner.temp }}/skyline-jail-browser.json
            ${{ runner.temp }}/skyline-end-browser.json
            ${{ runner.temp }}/skyline-turn-browser.json
            ${{ runner.temp }}/skyline-setup-browser.json
            ${{ runner.temp }}/skyline-asset-browser.json
            ${{ runner.temp }}/skyline-phase1.json
            ${{ runner.temp }}/skyline-browser-smoke.json
            ${{ runner.temp }}/skyline-human-flows.json
            ${{ runner.temp }}/skyline-offline-startup.json
            ${{ runner.temp }}/skyline-complete-matches.json
