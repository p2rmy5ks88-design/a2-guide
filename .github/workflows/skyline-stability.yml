name: Skyline stability tests

on:
  pull_request:
    paths:
      - 'skyline-estates/**'
      - '.github/workflows/skyline-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Use preinstalled Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome)"
          "$CHROME_BIN" --version
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Check generated offline assets
        run: python3 skyline-estates/build.py --check
      - name: Test saved turns and seeded games
        run: |
          node skyline-estates/tests/offline-worker.cjs
          node skyline-estates/tests/offline-startup.cjs "$RUNNER_TEMP/skyline-offline-startup.json"
          node skyline-estates/tests/remote-state.cjs
          node skyline-estates/tests/online-rooms.cjs
          node skyline-estates/tests/turn-resume.cjs
          node skyline-estates/tests/save-recovery.cjs
          node skyline-estates/tests/complete-matches.cjs "$RUNNER_TEMP/skyline-complete-matches.json"
          node skyline-estates/tests/human-flows.cjs "$RUNNER_TEMP/skyline-human-flows.json"
          node skyline-estates/tests/stability.cjs "$RUNNER_TEMP/skyline-phase1.json"
          node skyline-estates/tests/browser-smoke.cjs "$RUNNER_TEMP/skyline-browser-smoke.json"
      - name: Upload per-game results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-stability-results
          path: |
            ${{ runner.temp }}/skyline-phase1.json
            ${{ runner.temp }}/skyline-browser-smoke.json
            ${{ runner.temp }}/skyline-human-flows.json
            ${{ runner.temp }}/skyline-offline-startup.json
            ${{ runner.temp }}/skyline-complete-matches.json
