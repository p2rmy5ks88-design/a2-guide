name: Skyline native validation (simulator + emulator screenshots)
# Builds validation-only apps with a CI probe that opens Living City scenes in Dark and Daylight and screenshots them
# on an iOS 27 simulator and an Android emulator. No signing, no uploads, nothing shipped.
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [both, ios, android]
        default: both
permissions:
  contents: read
jobs:
  ios:
    if: inputs.platform != 'android'
    runs-on: xcode-27
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: skyline-estates-app
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare the validation app (probe injected)
        run: |
          for a in 1 2 3; do npm install --no-audit --no-fund && break; sleep 20; done
          npm run build:web
          node ../skyline-estates/tests/verify-bundle.cjs .
          bash scripts/inject-native-probe.sh
          npx cap add ios
          npm run assets -- --ios
          bash scripts/patch-ios.sh
          npx cap sync ios
      - name: Build for the simulator
        working-directory: skyline-estates-app/ios/App
        run: |
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/sim" IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -n 5
      - name: Screenshot Living City scenes (Dark + Daylight)
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          APP="$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator/App.app"
          RT=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["isAvailable"] and x["platform"]=="iOS"]; r.sort(key=lambda x:[int(v) for v in x["version"].split(".")]); print(r[-1]["identifier"])')
          DT=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rid=sys.argv[1]; r=[x for x in json.load(sys.stdin)["runtimes"] if x["identifier"]==rid][0]; ds=[d for d in r["supportedDeviceTypes"] if d["name"].startswith("iPhone")]; p=[d for d in ds if "Pro Max" in d["name"]] or ds; print(p[-1]["identifier"])' "$RT")
          echo "Runtime $RT device $DT"
          T(){ perl -e 'alarm shift; exec @ARGV' "$@"; }
          UDID=$(xcrun simctl create skyline-probe "$DT" "$RT"); xcrun simctl boot "$UDID"; T 300 xcrun simctl bootstatus "$UDID" -b || echo "bootstatus timed out"
          T 180 xcrun simctl install "$UDID" "$APP"
          T(){ perl -e 'alarm shift; exec @ARGV' "$@"; }   # bounded simctl calls (no hangs)
          for n in 1 2 3 4; do
            T 60 xcrun simctl launch --terminate-running-process "$UDID" com.kenstylez.skylineestates >/dev/null || echo "launch $n timed out"; sleep 75
            T 60 xcrun simctl io "$UDID" screenshot --display=1 "$RUNNER_TEMP/shots/ios-$n.png" || echo "screenshot $n failed"
            T 30 xcrun simctl terminate "$UDID" com.kenstylez.skylineestates || true; sleep 3
          done
          ls -la "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: native-validate-ios, path: '${{ runner.temp }}/shots/*.png' }
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
        working-directory: skyline-estates-app
    env: { VERSION_NAME: '1.0.${{ github.run_number }}-validate', VERSION_CODE: '${{ github.run_number }}' }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build the validation APK (target API 36, probe injected)
        run: |
          npm install --no-audit --no-fund
          npm run build:web
          node ../skyline-estates/tests/verify-bundle.cjs .
          bash scripts/inject-native-probe.sh
          npx cap add android
          npm run assets -- --android
          bash scripts/patch-android.sh
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon -q && grep -E "compileSdkVersion|targetSdkVersion" variables.gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Screenshot Living City scenes on the emulator (Dark + Daylight)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: skyline-estates-app
          script: bash scripts/android-probe-shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validate-android
          path: |
            skyline-estates-app/shots/*.png
            skyline-estates-app/shots/*.txt
