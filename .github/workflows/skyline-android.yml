name: Skyline Estates Android

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the build (and use signing credentials if configured)'
        type: boolean
        default: false
  pull_request:
    paths:
      - "skyline-estates/game.html"
      - "skyline-estates/reference-redesign.js"
      - "skyline-estates/lib/**"
      - "skyline-estates/riders/**"
      - "skyline-estates/photos/**"
      - "skyline-estates/art/**"
      - "skyline-estates/items/**"
      - "skyline-estates/icon-512.png"
      - "skyline-estates-app/**"
      - "eko-estates/audio/**"
      - "eko-estates/firebase-config.js"
      - ".github/workflows/skyline-android.yml"
      - "skyline-estates/tests/build-pipelines.py"
      - "skyline-estates/tests/verify-bundle.cjs"
  push:
    branches: [main]
    paths:
      - "skyline-estates/game.html"
      - "skyline-estates/reference-redesign.js"
      - "skyline-estates/lib/**"
      - "skyline-estates/riders/**"
      - "skyline-estates/photos/**"
      - "skyline-estates/art/**"
      - "skyline-estates/items/**"
      - "skyline-estates/icon-512.png"
      - "skyline-estates-app/**"
      - "eko-estates/audio/**"
      - "eko-estates/firebase-config.js"
      - ".github/workflows/skyline-android.yml"
      - "skyline-estates/tests/build-pipelines.py"
      - "skyline-estates/tests/verify-bundle.cjs"

permissions:
  contents: read

jobs:
  android:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: skyline-estates-app
    env:
      VERSION_NAME: '1.0.${{ github.run_number }}'
      VERSION_CODE: '${{ github.run_number }}'
      KEYSTORE_B64: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Check pipeline guardrails
        working-directory: .
        run: python3 skyline-estates/tests/build-pipelines.py
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build web game
        run: |
          npm run build:web
          node ../skyline-estates/tests/verify-bundle.cjs .
      - name: Create Android project
        run: |
          npx cap add android
          npm run assets -- --android
          bash scripts/patch-android.sh
          npx cap sync android
      - name: Build test APK
        working-directory: skyline-estates-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Build signed Play Store bundle
        if: github.event_name == 'workflow_dispatch' && inputs.publish && env.KEYSTORE_B64 != ''
        working-directory: skyline-estates-app/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: skyline-estates-android-${{ env.VERSION_NAME }}
          path: |
            skyline-estates-app/android/app/build/outputs/apk/debug/*.apk
            skyline-estates-app/android/app/build/outputs/apk/release/*.apk
            skyline-estates-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skyline-estates-android-1.0.${{ github.run_number }}
          path: downloaded
      - name: Publish the test APK for sideloading
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find downloaded -name app-debug.apk -type f)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" Skyline-Estates-Android-test.apk
          gh release view skyline-android-test >/dev/null 2>&1 || gh release create skyline-android-test --title "Skyline Estates for Android (test build)" --notes "Test build for installing directly on Android phones. Not signed for Google Play."
          gh release upload skyline-android-test Skyline-Estates-Android-test.apk --clobber
