name: Skyline Estates Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skyline-estates-app
    env:
      VERSION_NAME: '1.0.${{ github.run_number }}'
      VERSION_CODE: '${{ github.run_number }}'
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build web game
        run: npm run build:web
      - name: Create Android project
        run: |
          npx cap add android
          npm run assets -- --android
          bash scripts/patch-android.sh
          npx cap sync android
      - name: Build test APK
        working-directory: skyline-estates-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Build signed Play Store bundle
        if: env.KEYSTORE_B64 != ''
        working-directory: skyline-estates-app/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: skyline-estates-android-${{ env.VERSION_NAME }}
          path: |
            skyline-estates-app/android/app/build/outputs/apk/debug/*.apk
            skyline-estates-app/android/app/build/outputs/apk/release/*.apk
            skyline-estates-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
