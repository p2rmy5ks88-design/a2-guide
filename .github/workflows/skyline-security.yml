name: Skyline isolated security rules
on:
  pull_request:
    paths:
      - 'skyline-estates/security/**'
      - 'skyline-estates/database.rules.json'
      - '.github/workflows/skyline-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: skyline-estates/security
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: skyline-database-emulator-cli-14.12.0
      - name: Install pinned test tools
        run: npm install --no-audit --no-fund
      - name: Test permission boundaries and trusted admission locally
        run: npm test
      - name: Retain permission results and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-security-emulator-results
          path: |
            skyline-estates/security/security-results.json
            skyline-estates/security/service-results.json
            skyline-estates/security/debt-results.json
            skyline-estates/security/debt-service-results.json
            skyline-estates/security/auction-results.json
            skyline-estates/security/auction-service-results.json
            skyline-estates/security/card-results.json
            skyline-estates/security/card-service-results.json
            skyline-estates/security/jail-results.json
            skyline-estates/security/jail-service-results.json
            skyline-estates/security/end-results.json
            skyline-estates/security/end-service-results.json
            skyline-estates/security/turn-results.json
            skyline-estates/security/turn-service-results.json
            skyline-estates/security/roll-plan-results.json
            skyline-estates/security/setup-results.json
            skyline-estates/security/asset-results.json
            skyline-estates/security/*-debug.log
          if-no-files-found: warn
