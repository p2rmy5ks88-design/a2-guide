name: Skyline Estates iOS

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the build (and use signing credentials if configured)'
        type: boolean
        default: false
  pull_request:
    paths:
      - "skyline-estates/game.html"
      - "skyline-estates/lib/**"
      - "skyline-estates/riders/**"
      - "skyline-estates/photos/**"
      - "skyline-estates/art/**"
      - "skyline-estates/items/**"
      - "skyline-estates/icon-512.png"
      - "skyline-estates-app/**"
      - "eko-estates/audio/**"
      - "eko-estates/firebase-config.js"
      - ".github/workflows/skyline-ios.yml"
      - "skyline-estates/tests/build-pipelines.py"
      - "skyline-estates/tests/verify-bundle.cjs"
  push:
    branches: [main]
    paths:
      - "skyline-estates/game.html"
      - "skyline-estates/lib/**"
      - "skyline-estates/riders/**"
      - "skyline-estates/photos/**"
      - "skyline-estates/art/**"
      - "skyline-estates/items/**"
      - "skyline-estates/icon-512.png"
      - "skyline-estates-app/**"
      - "eko-estates/audio/**"
      - "eko-estates/firebase-config.js"
      - ".github/workflows/skyline-ios.yml"
      - "skyline-estates/tests/build-pipelines.py"
      - "skyline-estates/tests/verify-bundle.cjs"

permissions:
  contents: read

jobs:
  ios:
    timeout-minutes: 20
    runs-on: macos-15
    defaults:
      run:
        shell: bash
        working-directory: skyline-estates-app
    env:
      VERSION_NAME: '1.0.${{ github.run_number }}'
      VERSION_CODE: '${{ github.run_number }}'
      ASC_KEY_B64: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && secrets.APP_STORE_CONNECT_KEY_BASE64 || '' }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Check pipeline guardrails
        working-directory: .
        run: python3 skyline-estates/tests/build-pipelines.py
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build web game
        run: |
          npm run build:web
          node ../skyline-estates/tests/verify-bundle.cjs .
      - name: Create iOS project
        run: |
          npx cap add ios
          npm run assets -- --ios
          bash scripts/patch-ios.sh
          npx cap sync ios
      - name: Check it builds (simulator, unsigned)
        working-directory: skyline-estates-app/ios/App
        run: |
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/skyline-ios" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/skyline-ios-build.log" | tail -n 20
          test -d "$RUNNER_TEMP/skyline-ios/Build/Products/Release-iphonesimulator/App.app"
          tar -czf "$RUNNER_TEMP/skyline-ios-simulator.tar.gz" -C "$RUNNER_TEMP/skyline-ios/Build/Products/Release-iphonesimulator" App.app
      - name: Archive and upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.publish && env.ASC_KEY_B64 != ''
        working-directory: skyline-estates-app/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$ASC_KEY_B64" | base64 -d > "$RUNNER_TEMP/asc.p8"
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/asc.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER"
          xcodebuild $T -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SkylineEstates.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic $AUTH archive | tail -n 20
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SkylineEstates.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" $AUTH | tail -n 20
      - name: Upload simulator build and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-estates-ios-simulator
          path: |
            ${{ runner.temp }}/skyline-ios-simulator.tar.gz
            ${{ runner.temp }}/skyline-ios-build.log
          if-no-files-found: warn
