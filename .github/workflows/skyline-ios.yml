name: Skyline Estates iOS

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the build (and use signing credentials if configured)'
        type: boolean
        default: false
      cloud_channel:
        description: 'Accounts and purchases: off, private-testing (TestFlight only), or ios-release (public App Store build)'
        type: choice
        options: [off, private-testing, ios-release]
        default: 'off'
  pull_request:
    paths:
      - "skyline-estates/game.html"
      - "skyline-estates/reference-redesign.js"
      - "skyline-estates/lib/**"
      - "skyline-estates/riders/**"
      - "skyline-estates/photos/**"
      - "skyline-estates/art/**"
      - "skyline-estates/items/**"
      - "skyline-estates/icon-512.png"
      - "skyline-estates-app/**"
      - "eko-estates/audio/**"
      - "eko-estates/firebase-config.js"
      - ".github/workflows/skyline-ios.yml"
      - "skyline-estates/tests/build-pipelines.py"
      - "skyline-estates/tests/verify-bundle.cjs"
  push:
    branches: [main]
    paths:
      - "skyline-estates/game.html"
      - "skyline-estates/reference-redesign.js"
      - "skyline-estates/lib/**"
      - "skyline-estates/riders/**"
      - "skyline-estates/photos/**"
      - "skyline-estates/art/**"
      - "skyline-estates/items/**"
      - "skyline-estates/icon-512.png"
      - "skyline-estates-app/**"
      - "eko-estates/audio/**"
      - "eko-estates/firebase-config.js"
      - ".github/workflows/skyline-ios.yml"
      - "skyline-estates/tests/build-pipelines.py"
      - "skyline-estates/tests/verify-bundle.cjs"

permissions:
  contents: read

jobs:
  ios:
    timeout-minutes: 20
    runs-on: macos-26
    defaults:
      run:
        shell: bash
        working-directory: skyline-estates-app
    env:
      VERSION_NAME: '1.0.${{ github.run_number }}'
      VERSION_CODE: '${{ github.run_number }}'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Check pipeline guardrails
        working-directory: .
        run: |
          python3 skyline-estates/tests/build-pipelines.py
          python3 skyline-estates-app/scripts/verify-ios-sdk.test.py
          python3 skyline-estates-app/scripts/verify-signed-apple.test.py
          python3 skyline-estates-app/scripts/ios-distribution.test.py
          ruby -c skyline-estates-app/scripts/configure-ios-distribution.rb
          node skyline-estates-app/scripts/native-firebase-config.test.mjs
          node skyline-estates-app/scripts/patch-native-apple-errors.test.mjs
          swiftc -parse-as-library skyline-estates-app/native/AppleAuthorizationErrors.swift skyline-estates-app/native/AppleAuthorizationErrors.test.swift -o "$RUNNER_TEMP/apple-error-tests"
          "$RUNNER_TEMP/apple-error-tests"
          swiftc -parse-as-library skyline-estates-app/native/SkylineStoreProducts.swift skyline-estates-app/native/SkylineStoreProducts.test.swift -o "$RUNNER_TEMP/store-product-tests"
          "$RUNNER_TEMP/store-product-tests"
      - name: Require Xcode 26 and iOS 26 SDK
        run: |
          xcodebuild -version > "$RUNNER_TEMP/skyline-ios-toolchain.txt"
          xcrun --sdk iphoneos --show-sdk-version >> "$RUNNER_TEMP/skyline-ios-toolchain.txt"
          cat "$RUNNER_TEMP/skyline-ios-toolchain.txt"
          python3 scripts/verify-ios-sdk.py toolchain "$RUNNER_TEMP/skyline-ios-toolchain.txt"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build web game
        env:
          # Only a manual run may opt into private testing; pushes and PRs always build with accounts and purchases off.
          SKYLINE_CLOUD_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.cloud_channel || 'off' }}
        run: |
          npm run build:web
          node ../skyline-estates/tests/verify-bundle.cjs .
      - name: Create iOS project
        run: |
          npx cap add ios
          npm run assets -- --ios
          bash scripts/patch-ios.sh
          npx cap sync ios
      - name: Check it builds (simulator, unsigned)
        working-directory: skyline-estates-app/ios/App
        run: |
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/skyline-ios" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/skyline-ios-build.log" | tail -n 20
          test -d "$RUNNER_TEMP/skyline-ios/Build/Products/Release-iphonesimulator/App.app"
          tar -czf "$RUNNER_TEMP/skyline-ios-simulator.tar.gz" -C "$RUNNER_TEMP/skyline-ios/Build/Products/Release-iphonesimulator" App.app
      - name: Build unsigned iPhone IPA for Sideloadly
        working-directory: skyline-estates-app/ios/App
        run: |
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/skyline-ios-device" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            2>&1 | tee "$RUNNER_TEMP/skyline-ios-device-build.log" | tail -n 20
          PRODUCT="$RUNNER_TEMP/skyline-ios-device/Build/Products/Release-iphoneos/App.app"
          test -d "$PRODUCT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PRODUCT/Info.plist")" = 'com.kenstylez.skylineestates'
          test -f "$PRODUCT/GoogleService-Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$PRODUCT/GoogleService-Info.plist")" = 'com.kenstylez.skylineestates'
          test "$(/usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' "$PRODUCT/GoogleService-Info.plist")" = '1:668368365590:ios:03e33bfa0fd85930a32d37'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin:0' App/App.entitlements)" = 'Default'
          lipo "$PRODUCT/App" -verify_arch arm64
          xcrun vtool -show-build "$PRODUCT/App" | tee "$RUNNER_TEMP/skyline-ios-device-platform.txt"
          grep -Eq 'platform +IOS$' "$RUNNER_TEMP/skyline-ios-device-platform.txt"
          python3 "$GITHUB_WORKSPACE/skyline-estates-app/scripts/verify-ios-sdk.py" binary "$RUNNER_TEMP/skyline-ios-device-platform.txt"
          cmp "$GITHUB_WORKSPACE/skyline-estates/reference-redesign.js" "$PRODUCT/public/reference-redesign.js"
          mkdir -p "$RUNNER_TEMP/skyline-ipa/Payload"
          ditto "$PRODUCT" "$RUNNER_TEMP/skyline-ipa/Payload/App.app"
          (cd "$RUNNER_TEMP/skyline-ipa" && zip -qry "$RUNNER_TEMP/Skyline-Estates-Sideloadly-unsigned.ipa" Payload)
          unzip -t "$RUNNER_TEMP/Skyline-Estates-Sideloadly-unsigned.ipa" | tail -n 1
          (cd "$RUNNER_TEMP" && shasum -a 256 Skyline-Estates-Sideloadly-unsigned.ipa > Skyline-Estates-Sideloadly-unsigned.ipa.sha256)
          printf 'Skyline Estates — unsigned iPhone test build\nSource: %s\nVersion: %s (%s)\nBundle ID: com.kenstylez.skylineestates\nArchitecture/platform: arm64 iOS device\nRe-sign with Sideloadly before installation. Apple sign-in requires the exact bundle ID above and an Apple-enabled provisioning profile from your paid developer team. No TestFlight/App Store upload.\nThe app uses separate local storage from the web version.\n' "$GITHUB_SHA" "$VERSION_NAME" "$VERSION_CODE" > "$RUNNER_TEMP/SIDELOAD-README.txt"
      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: skyline-estates-ios-sideloadly-unsigned
          retention-days: 30
          path: |
            ${{ runner.temp }}/Skyline-Estates-Sideloadly-unsigned.ipa
            ${{ runner.temp }}/Skyline-Estates-Sideloadly-unsigned.ipa.sha256
            ${{ runner.temp }}/SIDELOAD-README.txt
            ${{ runner.temp }}/skyline-ios-device-platform.txt
            ${{ runner.temp }}/skyline-ios-toolchain.txt
          if-no-files-found: error
      - name: Archive and upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        working-directory: skyline-estates-app/ios/App
        env:
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_DISTRIBUTION_PROFILE_BASE64: ${{ secrets.IOS_DISTRIBUTION_PROFILE_BASE64 }}
        run: |
          # Credentials are scoped to this explicitly requested step, never npm/install/unsigned builds.
          for name in ASC_KEY_B64 ASC_KEY_ID ASC_ISSUER TEAM_ID IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_DISTRIBUTION_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then echo 'Required Apple signing configuration is missing'; exit 1; fi
          done
          umask 077
          trap 'python3 "$GITHUB_WORKSPACE/skyline-estates-app/scripts/ios-distribution.py" cleanup "$RUNNER_TEMP/skyline-distribution" || true; rm -f "$RUNNER_TEMP/asc.p8"' EXIT
          printf '%s' "$ASC_KEY_B64" | base64 -d > "$RUNNER_TEMP/asc.p8"
          python3 "$GITHUB_WORKSPACE/skyline-estates-app/scripts/ios-distribution.py" setup "$RUNNER_TEMP/skyline-distribution"
          ruby "$GITHUB_WORKSPACE/skyline-estates-app/scripts/configure-ios-distribution.rb" "$PWD/App.xcodeproj" "$RUNNER_TEMP/skyline-distribution/signing-settings.json"
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          AUTH="-authenticationKeyPath $RUNNER_TEMP/asc.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER"
          xcodebuild $T -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SkylineEstates.xcarchive" archive | tail -n 20
          python3 "$GITHUB_WORKSPACE/skyline-estates-app/scripts/verify-signed-apple.py" "$RUNNER_TEMP/SkylineEstates.xcarchive/Products/Applications/App.app"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SkylineEstates.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/skyline-distribution/export.plist" -exportPath "$RUNNER_TEMP/export" $AUTH | tail -n 20
      - name: Upload simulator build and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-estates-ios-simulator
          path: |
            ${{ runner.temp }}/skyline-ios-simulator.tar.gz
            ${{ runner.temp }}/skyline-ios-build.log
            ${{ runner.temp }}/skyline-ios-device-build.log
          if-no-files-found: warn
