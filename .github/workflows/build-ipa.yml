name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "Resources/www/**"
      - "README.md"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show tools
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          curl -fsSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen-tool
          echo "$PWD/xcodegen-tool/xcodegen/bin" >> $GITHUB_PATH

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Archero2Guide.xcodeproj \
            -target Archero2Guide \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            A2_CONTENT_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/Resources/www/index.html" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Archero2Guide.app Payload/
          zip -qry Archero2Guide.ipa Payload
          ls -lh Archero2Guide.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Archero2Guide-ipa
          path: Archero2Guide.ipa
          retention-days: 30

      - name: Upload build log (only if something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
