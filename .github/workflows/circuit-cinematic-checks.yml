name: Circuit cinematic draft checks
on:
  pull_request:
    paths:
      - 'skyline-estates/circuit-alpha.html'
      - 'skyline-estates/lib/circuit-ui.js'
      - 'skyline-estates/lib/circuit-renderer-3d.js'
      - 'skyline-estates/lib/circuit-screen.js'
      - 'skyline-estates/lib/circuit-rules.js'
      - 'skyline-estates/circuit-cinematic-lab.html'
      - 'skyline-estates/design/circuit-design-v1.json'
      - 'skyline-estates/tests/circuit-*.cjs'
      - '.github/workflows/circuit-cinematic-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cinematic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check skyline-estates/lib/circuit-ui.js
          node --check skyline-estates/tests/circuit-access-guard.cjs
          node --check skyline-estates/tests/circuit-access-browser.cjs
          node --check skyline-estates/lib/circuit-renderer-3d.js
          node --check skyline-estates/tests/circuit-visual-contract.cjs
          node --check skyline-estates/tests/circuit-city-view.cjs
          node --check skyline-estates/tests/circuit-cinematic-lab.cjs
          node --check skyline-estates/tests/circuit-city-camera-audit.cjs
          node --check skyline-estates/tests/circuit-city-camera-sweep.cjs
          node --check skyline-estates/tests/circuit-camera-screenshots.cjs
          node --check skyline-estates/tests/circuit-render-sharpness.cjs
          node --check skyline-estates/tests/circuit-playable-screenshots.cjs
      - name: Run cinematic contract checks
        run: |
          node skyline-estates/tests/circuit-access-guard.cjs
          node skyline-estates/tests/circuit-city-view.cjs
          node skyline-estates/tests/circuit-cinematic-lab.cjs
          node skyline-estates/tests/circuit-render-sharpness.cjs
          node skyline-estates/tests/circuit-visual-contract.cjs
      - name: Audit all 15 screen classes (report-only)
        env:
          CITY_CAMERA_REPORT: cinematic-camera-report.json
        run: node skyline-estates/tests/circuit-city-camera-audit.cjs
      - name: Sweep camera pitches and distances (diagnostic)
        env:
          CAMERA_SWEEP_REPORT: cinematic-camera-sweep.json
        run: node skyline-estates/tests/circuit-city-camera-sweep.cjs
      - name: Install browser test dependency
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Verify public preview link gate in Chromium
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node skyline-estates/tests/circuit-access-browser.cjs
      - name: Capture cinematic camera lab screenshots
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CIRCUIT_SCREENSHOT_DIR: circuit-camera-screenshots
        run: |
          python3 -m http.server 8765 --directory skyline-estates > /tmp/circuit-preview.log 2>&1 &
          sleep 2
          node skyline-estates/tests/circuit-camera-screenshots.cjs
          node skyline-estates/tests/circuit-playable-screenshots.cjs
      - name: Install Safari-engine test browser
        run: npx --prefix skyline-estates/tests playwright install --with-deps webkit
      - name: Verify public preview link gate in WebKit
        env:
          VISUAL_ENGINE: webkit
        run: node skyline-estates/tests/circuit-access-browser.cjs
      - name: Verify Safari-engine Circuit City View
        env:
          CIRCUIT_VISUAL_ENGINE: webkit
          CIRCUIT_SCREENSHOT_DIR: circuit-camera-webkit-screenshots
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: node skyline-estates/tests/circuit-playable-screenshots.cjs
      - name: Publish Safari-engine Circuit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-webkit-city-evidence
          path: circuit-camera-webkit-screenshots/
          if-no-files-found: ignore
      - name: Publish camera screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-camera-visual-evidence
          path: circuit-camera-screenshots/
          if-no-files-found: ignore
      - name: Publish camera audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-cinematic-camera-audit
          path: |
            cinematic-camera-report.json
            cinematic-camera-sweep.json
          if-no-files-found: ignore
      # These are staging artifacts only. The generated files are committed later
      # to this draft branch, and the full Skyline stability gate still verifies
      # their checked-in parity before this PR can leave draft.
      - name: Generate reproducible offline assets for draft QA
        if: always()
        run: |
          python3 skyline-estates/build.py
          python3 skyline-estates/build.py --check
      - name: Publish draft generated asset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-generated-assets-preview
          path: |
            skyline-estates/offline-assets.js
            skyline-estates/sw.js
          if-no-files-found: error
