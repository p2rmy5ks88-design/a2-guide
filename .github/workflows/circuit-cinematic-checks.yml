name: Circuit cinematic draft checks
on:
  pull_request:
    paths:
      - 'skyline-estates/lib/circuit-ui.js'
      - 'skyline-estates/lib/circuit-screen.js'
      - 'skyline-estates/lib/circuit-rules.js'
      - 'skyline-estates/circuit-cinematic-lab.html'
      - 'skyline-estates/design/circuit-design-v1.json'
      - 'skyline-estates/tests/circuit-*.cjs'
      - '.github/workflows/circuit-cinematic-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cinematic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check skyline-estates/lib/circuit-ui.js
          node --check skyline-estates/tests/circuit-city-view.cjs
          node --check skyline-estates/tests/circuit-cinematic-lab.cjs
          node --check skyline-estates/tests/circuit-city-camera-audit.cjs
          node --check skyline-estates/tests/circuit-city-camera-sweep.cjs
          node --check skyline-estates/tests/circuit-camera-screenshots.cjs
          node --check skyline-estates/tests/circuit-render-sharpness.cjs
          node --check skyline-estates/tests/circuit-playable-screenshots.cjs
      - name: Run cinematic contract checks
        run: |
          node skyline-estates/tests/circuit-city-view.cjs
          node skyline-estates/tests/circuit-cinematic-lab.cjs
          node skyline-estates/tests/circuit-render-sharpness.cjs
      - name: Audit all 15 screen classes (report-only)
        env:
          CITY_CAMERA_REPORT: cinematic-camera-report.json
        run: node skyline-estates/tests/circuit-city-camera-audit.cjs
      - name: Sweep camera pitches and distances (diagnostic)
        env:
          CAMERA_SWEEP_REPORT: cinematic-camera-sweep.json
        run: node skyline-estates/tests/circuit-city-camera-sweep.cjs
      - name: Install browser test dependency
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Capture cinematic camera lab screenshots
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CIRCUIT_SCREENSHOT_DIR: circuit-camera-screenshots
        run: |
          python3 -m http.server 8765 --directory skyline-estates > /tmp/circuit-preview.log 2>&1 &
          sleep 2
          node skyline-estates/tests/circuit-camera-screenshots.cjs
          node skyline-estates/tests/circuit-playable-screenshots.cjs
      - name: Publish camera screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-camera-visual-evidence
          path: circuit-camera-screenshots/
          if-no-files-found: ignore
      - name: Publish camera audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-cinematic-camera-audit
          path: |
            cinematic-camera-report.json
            cinematic-camera-sweep.json
          if-no-files-found: ignore
