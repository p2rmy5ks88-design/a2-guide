name: Circuit retina palette asset preflight (draft)
on:
  pull_request:
    paths:
      - '.github/workflows/circuit-assets-preview-once.yml'
      - 'skyline-estates/lib/circuit-renderer-3d.js'
      - 'skyline-estates/lib/circuit-ui.js'
      - 'skyline-estates/tests/circuit-visual-contract.cjs'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and check generated assets
        run: |
          python3 skyline-estates/build.py
          python3 skyline-estates/build.py --check
      - name: Export exact current assets
        uses: actions/upload-artifact@v4
        with:
          name: circuit-retina-palette-cache
          path: |
            skyline-estates/offline-assets.js
            skyline-estates/sw.js
          if-no-files-found: error
