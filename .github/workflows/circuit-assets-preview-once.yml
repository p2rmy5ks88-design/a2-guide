name: Circuit camera asset preflight (draft)
on:
  pull_request:
    paths:
      - '.github/workflows/circuit-assets-preview-once.yml'
      - 'skyline-estates/lib/circuit-ui.js'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Rebuild and verify offline asset manifest
        run: |
          python3 skyline-estates/build.py
          python3 skyline-estates/build.py --check
      - name: Export generated assets
        uses: actions/upload-artifact@v4
        with:
          name: circuit-camera-asset-stamp
          path: |
            skyline-estates/offline-assets.js
            skyline-estates/sw.js
          if-no-files-found: error
