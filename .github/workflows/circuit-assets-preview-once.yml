name: Circuit preview-gate cache preflight (draft)
on:
  pull_request:
    paths:
      - '.github/workflows/circuit-assets-preview-once.yml'
      - 'skyline-estates/circuit-alpha.html'
      - 'skyline-estates/lib/circuit-ui.js'
      - 'skyline-estates/lib/circuit-bench.js'
permissions: {contents: read}
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and verify offline assets
        run: |
          python3 skyline-estates/build.py
          python3 skyline-estates/build.py --check
      - name: Upload deterministic cache
        uses: actions/upload-artifact@v4
        with:
          name: circuit-preview-gate-offline-cache
          path: |
            skyline-estates/offline-assets.js
            skyline-estates/sw.js
          if-no-files-found: error
