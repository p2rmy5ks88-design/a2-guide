name: Circuit final red-crown asset preflight (draft)
on:
  pull_request:
    paths:
      - '.github/workflows/circuit-assets-preview-once.yml'
      - 'skyline-estates/lib/circuit-renderer-3d.js'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate deterministic offline cache
        run: |
          python3 skyline-estates/build.py
          python3 skyline-estates/build.py --check
      - name: Export exact generated assets
        uses: actions/upload-artifact@v4
        with:
          name: circuit-final-red-crown-cache
          path: |
            skyline-estates/offline-assets.js
            skyline-estates/sw.js
          if-no-files-found: error
