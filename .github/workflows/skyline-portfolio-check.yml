name: Portfolio Gallery review checks

on:
  push:
    branches: [skyline-portfolio-gallery]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source and offline build
        run: |
          node --check skyline-estates/home-redesign.js
          node --check skyline-estates/tests/portfolio-gallery-browser.cjs
          python3 skyline-estates/build.py
          python3 skyline-estates/build.py --check
      - name: Install browser test dependencies
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Check Gallery and new artwork in desktop and mobile
        run: CHROME_PATH="$(command -v google-chrome)" node skyline-estates/tests/portfolio-gallery-browser.cjs
      - name: Check Collection Vault
        run: CHROME_PATH="$(command -v google-chrome)" node skyline-estates/tests/collection-vault-browser.cjs
      - name: Check existing home redesign
        run: CHROME_PATH="$(command -v google-chrome)" node skyline-estates/tests/home-redesign-browser.cjs
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-portfolio-review
          path: |
            ${{ runner.temp }}/skyline-portfolio-*.png
            ${{ runner.temp }}/skyline-vault-*.png
      - name: Commit regenerated offline files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin skyline-portfolio-gallery
            git reset --hard origin/skyline-portfolio-gallery
            python3 skyline-estates/build.py
            git add skyline-estates/index.html skyline-estates/offline-assets.js
            if git diff --cached --quiet; then
              echo "Offline assets already current."
              exit 0
            fi
            git commit -m "build: refresh Skyline portfolio image manifest"
            if git push origin HEAD:skyline-portfolio-gallery; then
              exit 0
            fi
          done
          echo "Unable to synchronize generated files after retries."
          exit 1
