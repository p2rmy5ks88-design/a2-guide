name: Collection Vault branch validation

on:
  push:
    branches: [skyline-collection-vault]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vault:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Collection Vault JavaScript
        run: |
          node --check skyline-estates/home-redesign.js
          node --check skyline-estates/tests/collection-vault-browser.cjs
      - name: Regenerate standalone and offline manifests
        run: |
          python3 skyline-estates/build.py
          python3 skyline-estates/build.py --check
      - name: Install browser-test dependencies
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Test Collection Vault in desktop and mobile landscape
        run: |
          CHROME_PATH="$(command -v google-chrome)" node skyline-estates/tests/collection-vault-browser.cjs
      - name: Commit generated files to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skyline-estates/index.html skyline-estates/offline-assets.js
          if ! git diff --cached --quiet; then
            git commit -m "build: sync Collection Vault offline manifest"
            git push origin HEAD:skyline-collection-vault
          fi
