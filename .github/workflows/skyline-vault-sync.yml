name: Skyline artwork branch verification

on:
  push:
    branches: [skyline-collection-vault]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate code and SVG
        run: |
          node --check skyline-estates/home-redesign.js
          node --check skyline-estates/tests/collection-vault-browser.cjs
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('skyline-estates/art/skyline-gala.svg'); ET.parse('skyline-estates/art/golden-rooftop-garden.svg')"
      - name: Regenerate web and offline assets
        run: |
          python3 skyline-estates/build.py
          python3 skyline-estates/build.py --check
      - name: Install Playwright
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Check artwork and Vault across desktop and phone
        run: CHROME_PATH="$(command -v google-chrome)" node skyline-estates/tests/collection-vault-browser.cjs
      - name: Check room invite controls
        run: CHROME_PATH="$(command -v google-chrome)" node skyline-estates/security/service/room-entry-browser.test.cjs "$RUNNER_TEMP/skyline-room-entry-browser.json"
      - name: Check legacy collection and portfolio
        run: CHROME_PATH="$(command -v google-chrome)" SKYLINE_NO_WEBGL=1 node skyline-estates/tests/reference-dashboard-browser.cjs "$RUNNER_TEMP/skyline-reference-dashboard.json"
      - name: Upload desktop and phone previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-artwork-and-vault-previews
          path: |
            ${{ runner.temp }}/skyline-home-art-*.png
            ${{ runner.temp }}/skyline-vault-*.png
            ${{ runner.temp }}/skyline-reference-dashboard.collection*.png
      - name: Commit generated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skyline-estates/index.html skyline-estates/offline-assets.js
          if ! git diff --cached --quiet; then
            git commit -m "build: include gala and rooftop reward art in offline manifest"
            git push origin HEAD:skyline-collection-vault
          fi
