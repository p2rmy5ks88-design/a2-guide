name: Harbour Ring refresh generated web assets
on:
  push:
    branches: [feat/harbour-living-city-visuals]
    paths:
      - '.github/workflows/harbour-refresh-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/harbour-living-city-visuals
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate canonical web bundle and offline manifest
        run: python3 skyline-estates/build.py
      - name: Commit generated files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skyline-estates/index.html skyline-estates/web-play.html skyline-estates/web-correction.html skyline-estates/web-follow.html skyline-estates/web-board.html skyline-estates/web-menus.html skyline-estates/offline-assets.js skyline-estates/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Refresh generated Harbour Ring offline assets"
            git push
          fi
