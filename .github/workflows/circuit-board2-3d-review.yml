name: Circuit Board 2 experimental 3D city review
on:
  pull_request:
    paths:
      - 'skyline-estates/circuit-board2-lab.html'
      - 'skyline-estates/lib/circuit-board2-ui.js'
      - 'skyline-estates/lib/circuit-board2-renderer.js'
      - 'skyline-estates/tests/circuit-board2-browser.cjs'
      - '.github/workflows/circuit-board2-3d-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interactive-city:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated Board 2 sources and rules
        run: |
          node --check skyline-estates/lib/circuit-board2-ui.js
          node --check skyline-estates/tests/circuit-board2-browser.cjs
          node skyline-estates/tests/circuit-rules.cjs
          python3 skyline-estates/build.py --check
      - name: Install browser test runner
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Test real interactive WebGL gameplay (Chromium)
        env:
          BOARD2_SHOTS: board2-qa
          CHROME_PATH: /usr/bin/google-chrome
        run: node skyline-estates/tests/circuit-board2-browser.cjs
      - name: Install Safari engine
        run: npx --prefix skyline-estates/tests playwright install --with-deps webkit
      - name: Test real interactive WebGL gameplay (WebKit)
        env:
          VISUAL_ENGINE: webkit
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          BOARD2_SHOTS: board2-qa
        run: node skyline-estates/tests/circuit-board2-browser.cjs
      - name: Upload Board 2 interactive 3D QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-circuit-board2-3d-qa
          path: board2-qa/
          if-no-files-found: ignore
