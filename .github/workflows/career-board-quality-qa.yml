name: Career Boards 2–3 visual and gameplay QA
on:
  pull_request:
    paths:
      - 'skyline-estates/city-ventures-renderer.js'
      - 'skyline-estates/crossroads-renderer.js'
      - 'skyline-estates/tests/city-ventures-browser.cjs'
      - 'skyline-estates/tests/crossroads-browser.cjs'
      - '.github/workflows/career-board-quality-qa.yml'
  workflow_dispatch:
# A new commit supersedes old 3D screenshot matrices; avoid congesting CI.
concurrency:
  group: career-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  actual-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        board: [city-ventures, crossroads]
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test dependencies
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Install test browser
        run: npx --prefix skyline-estates/tests playwright install --with-deps ${{ matrix.engine }}
      - name: Browser test with real game and local 3D assets
        env:
          VISUAL_ENGINE: ${{ matrix.engine }}
          VISUAL_ORIGIN: http://127.0.0.1:8790/
          CHROME_PATH: /usr/bin/google-chrome
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          set -e
          case "${{ matrix.board }}" in
            city-ventures) script=city-ventures-browser.cjs ;;
            crossroads) script=crossroads-browser.cjs ;;
          esac
          python3 -m http.server 8790 --bind 127.0.0.1 --directory . >"$RUNNER_TEMP/career-http.log" 2>&1 &
          node "skyline-estates/tests/$script"
      - name: Save actual gameplay screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-${{ matrix.board }}-${{ matrix.engine }}
          path: skyline-estates/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # A device-scale WebKit test, separate from full-match 1× software-render QA.
  # This is a simulator-style viewport/DPR check, NOT a physical iPhone test.
  crossroads-retina-webkit:
    name: Crossroads Retina 3× (simulated iPhone landscape)
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test dependencies
        run: npm install --prefix skyline-estates/tests --no-audit --no-fund
      - name: Install WebKit and software rendering dependencies
        run: npx --prefix skyline-estates/tests playwright install --with-deps webkit
      - name: Verify 3× screenshots and adaptive WebGL sharpness on 956×440 landscape
        env:
          VISUAL_ENGINE: webkit
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          CROSSROADS_RETINA_ONLY: '1'
        run: node skyline-estates/tests/crossroads-browser.cjs
      - name: Preserve real DPR3 screenshot and rendering metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossroads-retina-webkit-dpr3
          path: skyline-estates/test-results/crossroads/
          if-no-files-found: ignore
          retention-days: 7

  # macOS WebKit offers an additional GPU-capable Safari-family signal; like
  # Linux WebKit it remains simulated, not a physical iPhone 18 Pro Max.
  crossroads-retina-macos:
    name: Crossroads Retina 3× (macOS WebKit GPU)
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright dependencies and native macOS WebKit
        run: |
          npm install --prefix skyline-estates/tests --no-audit --no-fund
          npx --prefix skyline-estates/tests playwright install webkit
      - name: Capture 3× WebGL drawing buffer, camera and performance metrics
        env:
          VISUAL_ENGINE: webkit
          CROSSROADS_RETINA_ONLY: '1'
        run: node skyline-estates/tests/crossroads-browser.cjs
      - name: Preserve macOS WebKit Retina evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossroads-retina-macos-webkit
          path: skyline-estates/test-results/crossroads/
          if-no-files-found: ignore
          retention-days: 7
