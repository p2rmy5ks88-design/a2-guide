<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Skyline Origins — approved-art premium visual review</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1930;color:#fff2d8;font-family:system-ui,-apple-system,Arial,sans-serif}
#originsGame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#reviewLabel{position:fixed;bottom:6px;right:7px;z-index:90;max-width:28vw;
  pointer-events:none;font-size:9px;font-weight:850;letter-spacing:.6px;line-height:1.3;
  text-shadow:0 1px 2px #061222;color:#ffe4a3;
  background:#0a1b30db;border:1px solid #d6b57c78;border-radius:8px;padding:5px 7px}
#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#ffe8b5;font-weight:850;font-size:12px}
</style>
</head>
<body>
<div id="status" role="status">Loading the real Skyline Origins game…</div>
<iframe title="Skyline Origins live gameplay with unreleased premium visual review" id="originsGame" src="about:blank"></iframe>
<div id="reviewLabel">ORIGINS VISUAL LAB · NOT LIVE</div>
<script>
(()=>{
 const iframe=document.querySelector('#originsGame'),status=document.querySelector('#status');
 iframe.addEventListener('load',()=>{
  try{
   const d=iframe.contentDocument;
   if(!d||!d.head)throw Error('Cannot attach Origins preview skin');
   // Keep the existing draft intact; the new reconstruction is opt-in until validated.
   const legacy=new URLSearchParams(location.search).get('production')!=='1';if(!legacy)document.querySelector('#reviewLabel').hidden=true;
   const link=d.createElement('link');link.rel='stylesheet';link.href=legacy?'./origins-premium.css':'./origins-production.css';d.head.append(link);
   const script=d.createElement('script');script.src=legacy?'./origins-premium.js':'./origins-production-adapter.js';
   script.addEventListener('load',()=>{status.hidden=true;if(legacy)iframe.contentWindow.SkylineOriginsPremiumLab?.refresh()});
   script.addEventListener('error',()=>{status.textContent='Origins preview visual resources are unavailable'});
   d.body.append(script);
  }catch(e){status.textContent='Origins preview cannot load: '+e.message}
 });
 const forwarded=new URLSearchParams();for(const key of ['quality','source']){const value=new URLSearchParams(location.search).get(key);if(value)forwarded.set(key,value);}iframe.src='./index.html'+(forwarded.size?'?'+forwarded:'');
})();
</script>
</body>
</html>
