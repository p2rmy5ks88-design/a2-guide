<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#132338">
<title>Skyline Estates — Circuit Living Board</title>
<style>
:root{--navy:#12233b;--cream:#fff0d2;--gold:#efbd56;--ink:#26313e;--wood:#8d4f2a;--burnt:#d97049;--mint:#4bb9a2;--shadow:0 10px 28px #050c19a8;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#11223c;color:#f7f1e7;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.46;cursor:default}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 51% 35%,#6d9f78 0,#598769 25%,#2b584b 49%,#102739 88%);isolation:isolate}
#game:before{position:absolute;inset:0;content:"";background:repeating-linear-gradient(124deg,transparent 0 90px,#ffffff05 90px 92px),radial-gradient(circle at 20% 85%,#e5ac6a2c,transparent 58%);pointer-events:none}
#tableViewport{position:absolute;inset:0;perspective:1500px;overflow:hidden;touch-action:none;cursor:grab}
#tableViewport.dragging{cursor:grabbing}
#boardStage{position:absolute;left:50%;top:50%;width:720px;height:720px;transform-origin:50% 50%;will-change:transform}
#board{position:absolute;inset:0;border:17px solid #b9793c;border-radius:21px;background:linear-gradient(138deg,#e7c493 0,#ffe4b6 33%,#efd0a0 72%,#bf925d 100%);box-shadow:0 17px 0 #633d2d,0 27px 0 #392723,0 34px 50px #000b, inset 0 0 0 6px #f9e5b4,inset 0 0 0 11px #7e4a32}
#board:before{position:absolute;inset:11px;content:"";pointer-events:none;border:4px double #d6a758;border-radius:4px;box-shadow:inset 0 0 0 2px #8f6543}
#board:after{position:absolute;inset:-19px;content:"";pointer-events:none;border:4px solid #eab762;border-radius:25px;box-shadow:0 1px 0 #fbe2a5}
#innerGarden{position:absolute;left:274px;top:274px;width:172px;height:172px;border:8px solid #a78556;border-radius:8px;background:radial-gradient(ellipse at 50% 47%,#50a283 0 17%,#267b77 18% 26%,#d9c6a4 27% 31%,#8bba75 32% 67%,#4e8d4f 68%);box-shadow:0 7px 5px #261d1594,inset 0 0 0 4px #f8e5bb}
#innerGarden:after{content:"";position:absolute;left:47px;top:46px;width:62px;height:62px;border:4px solid #f7e0a5;border-radius:50%;background:radial-gradient(circle,#d2f9f4 0 16%,#44a8bb 18% 58%,#1b6986 60%);box-shadow:0 3px 9px #12303a99}
#innerGarden:before{content:"";position:absolute;left:63px;top:-16px;height:58px;width:36px;border:3px solid #f6dfaf;background:repeating-linear-gradient(90deg,#416e88 0 8px,#9fd1c6 8px 10px),repeating-linear-gradient(0deg,#4f8195 0 9px,#f5dda8 9px 12px);box-shadow:4px 4px 0 #244b66,6px 8px 8px #1e3c427a;transform:skewY(-4deg)}
#parkLogo{position:absolute;top:345px;left:280px;width:160px;text-align:center;z-index:2;pointer-events:none}
#parkLogo b{display:block;font-size:18px;letter-spacing:1.5px;color:#fff4ce;text-shadow:0 3px 5px #123c30,1px 1px #153228}
#parkLogo small{font-size:12px;letter-spacing:4px;color:#ffffe1;text-shadow:0 2px 4px #163128;font-weight:900}
#parkTrees{position:absolute;left:278px;top:278px;width:165px;height:165px;pointer-events:none}
.tree{position:absolute;width:23px;height:23px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#b5d766,#3e904e 55%,#1f5c39 80%);box-shadow:5px 7px 1px #0c412445,0 2px 0 3px #3b5536}
.tree:nth-child(1){left:9px;top:9px}.tree:nth-child(2){right:11px;top:11px}.tree:nth-child(3){left:11px;bottom:10px}.tree:nth-child(4){right:11px;bottom:10px}
.street{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#ba8d5c00,#cb9a6a17);border-radius:12px}
.skybridge{position:absolute;background:#50717d;border:3px solid #efdfb5;box-shadow:0 5px 0 #36516c,inset 0 0 0 3px #345f79;opacity:.9;pointer-events:none}
.skybridge.h{width:96px;height:18px}.skybridge.v{height:96px;width:18px}
#bridgeTL{left:106px;top:185px;transform:rotate(45deg)}#bridgeTR{right:106px;top:185px;transform:rotate(-45deg)}
#bridgeBR{right:106px;bottom:185px;transform:rotate(45deg)}#bridgeBL{left:106px;bottom:185px;transform:rotate(-45deg)}
.tile{position:absolute;width:107px;height:107px;transform:translate(-50%,-50%);overflow:visible;border:2px solid #bb9b6f;border-radius:4px;background:linear-gradient(145deg,#fff6df 0,#f4dec0 62%,#d2ad7e 100%);box-shadow:1px 3px 0 #aa784a,3px 6px 0 #75492d,4px 9px 9px #2e271c7d;user-select:none;color:#263243;transition:filter .16s,border-color .16s;outline:0;touch-action:none}
.tile:before{content:"";position:absolute;inset:4px;border:1px solid #cab58f;border-radius:2px;pointer-events:none}
.tile:hover,.tile:focus-visible{filter:brightness(1.08);z-index:8}
.tile.selected{border:3px solid #fff0a3;box-shadow:0 0 0 3px #cc873f,2px 5px 0 #9a5d35,0 9px 16px #151e2980;z-index:12}
.tile.current{box-shadow:0 0 0 3px #e9aa36,2px 5px 0 #7c4f25,0 9px 19px #152420a3}
.tile .stripe{position:absolute;top:0;left:0;right:0;height:13px;background:var(--district);border-bottom:2px solid #d7b67a;box-shadow:inset 0 2px #ffffff3b;border-radius:1px}
.tile .name{position:absolute;left:6px;right:6px;top:18px;height:32px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;line-height:1.05;font-weight:900;letter-spacing:.15px;text-transform:uppercase;text-shadow:0 1px #fff9eb}.tile.property .name{top:62px;height:29px;font-size:10px;line-height:1.02;letter-spacing:.1px;z-index:6;background:linear-gradient(180deg,#fff6dfeb,#ecd0a5f4);border-top:1px solid #c4a372;padding:2px;border-radius:0 0 2px 2px}.tile.property .price{z-index:7;background:#f2dab6ed;bottom:0;padding:0 2px;height:14px;line-height:14px}
.tile .price{position:absolute;bottom:5px;left:3px;right:3px;text-align:center;font-size:13px;font-weight:950;letter-spacing:-.3px;color:#1c2735;text-shadow:0 1px #fff5cf}.tile.property .price{bottom:2px;font-size:12px}
.tile .stamp{position:absolute;right:5px;top:53px;font-size:9px;font-weight:900;color:#51605c}
.tile .lot{position:absolute;left:50%;top:21px;transform:translateX(-50%) skewX(-6deg);width:54px;height:39px;background:linear-gradient(155deg,#d1c6a2,#91b783);border:2px solid #f2dcb2;box-shadow:0 3px 0 #57865c,3px 6px 2px #3450388f;border-radius:2px}
.tile .lot:before{content:"";position:absolute;left:8px;bottom:5px;width:20px;height:26px;border:2px solid #f8e2b3;border-bottom:4px solid #a3b4a1;background:repeating-linear-gradient(0deg,#3f7183 0 5px,#e2d6b0 5px 7px);box-shadow:3px 3px 0 #1e4f62,4px 5px 5px #253c3d91}
.tile .lot:after{content:"";position:absolute;right:5px;top:6px;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 33% 28%,#b6cf77 0,#3d9254 45%,#1b6040 83%);box-shadow:2px 4px 0 #2b5739}
.tile.special{background:linear-gradient(135deg,#e3eed8,#bbd7c2 54%,#77ac9b)}
.tile.special .stripe{background:linear-gradient(90deg,#2f7290,#68b9b2)}
.tile.special .name{top:34px;font-size:12px}
.tile.special .specialIcon{position:absolute;left:0;right:0;top:13px;text-align:center;font-size:24px;text-shadow:1px 3px #12425230}
.tile.event{background:linear-gradient(130deg,#fff0d4,#e8c391)}
.tile.event .stripe{background:#e9a34a}
.tile.event .name{top:49px;font-size:12px}
.tile.event .specialIcon{top:18px}
.tile.owned{border-color:var(--owner,#e5b362)}
.tile .ownerBand{position:absolute;inset:auto 0 0;height:8px;background:var(--owner);border-top:1px solid #fff8}
.tile .towers{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:64px;height:65px;pointer-events:none}
.model{position:absolute;left:50%;bottom:7px;width:43px;transform:translateX(-50%);height:var(--height,28px);background:repeating-linear-gradient(0deg,transparent 0 9px,var(--facade-joint,#0a2931) 9px 11px),repeating-linear-gradient(90deg,var(--facade-main,#547f8c) 0 7px,var(--facade-glass,#b6deca) 7px 9px,var(--facade-main,#406a7b) 9px 15px);border:3px solid #e9d3a4;border-bottom:5px solid #435d6e;box-shadow:4px 4px 0 #1c4659,7px 7px 8px #071b315a}
.model:before{position:absolute;top:-10px;left:-2px;content:"";height:9px;width:100%;background:linear-gradient(110deg,var(--facade-roof,#f9df91),#f0d398);transform:skewX(-25deg);border:1px solid #735940}
.model:after{position:absolute;top:-4px;left:100%;content:"";height:100%;width:9px;background:repeating-linear-gradient(var(--facade-side,#294d61) 0 11px,var(--facade-main,#517f95) 11px 16px);transform:skewY(-45deg);transform-origin:left top}
.tile.district0{--facade-main:#296b9c;--facade-glass:#9bdaf0;--facade-joint:#17435e;--facade-side:#18476a;--facade-roof:#65c8f0}
.tile.district1{--facade-main:#ad7c34;--facade-glass:#ffe0a4;--facade-joint:#6c4b29;--facade-side:#76502f;--facade-roof:#ffcb65}
.tile.district2{--facade-main:#27765f;--facade-glass:#b3ecca;--facade-joint:#164d46;--facade-side:#164c4c;--facade-roof:#7cde9b}
.tile.district3{--facade-main:#b64f48;--facade-glass:#ffd0aa;--facade-joint:#70323d;--facade-side:#83343f;--facade-roof:#f68f6a}
.tile.district0 .model:before{border-top:2px solid #e5f9ff}
.tile.district1 .model:before{box-shadow:0 -4px 0 #d7a94d}
.tile.district2 .model:before{box-shadow:inset 0 4px 0 #3c9254}
.tile.district3 .model:before{box-shadow:0 -3px 0 #a74840}
.model.level1{--height:22px;width:37px;background:#d2bb94;box-shadow:4px 4px #856b4e}
.model.level2{--height:32px;width:37px}
.model.level3{--height:49px}
.model.level4{--height:66px;width:46px;border-color:#f5d68f;box-shadow:5px 6px #26495a,8px 10px 12px #071c2c96}
.tokenDock{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.pawn{position:absolute;z-index:20;width:28px;height:15px;border-radius:5px 6px 4px 4px;background:linear-gradient(105deg,#f1e6bd,var(--player) 31%,var(--player) 73%,#254660);box-shadow:0 4px 0 #20303c,2px 7px 6px #07152399;border:2px solid #f9e3aa;transform:translate(-50%,-50%) rotate(-7deg);transition:left .12s linear,top .12s linear}
.pawn:before{content:"";position:absolute;left:4px;top:-10px;width:17px;height:10px;border-radius:6px 6px 1px 1px;background:linear-gradient(110deg,#acd4e1,#345a75 65%,#d0e3d5);border:2px solid var(--player);box-shadow:0 -1px 0 #f7e2a1}
.pawn:after{content:"";position:absolute;left:2px;bottom:-6px;width:6px;height:7px;border-radius:50%;background:#111e2b;box-shadow:17px 0 #111e2b,1px -13px 0 -2px #ffe3ae}
.pawn.turn{filter:drop-shadow(0 0 6px #ffe490)}
#hud{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:185px;z-index:50;pointer-events:auto}
.hudCard{padding:12px 13px 13px;background:linear-gradient(145deg,#0b1e33ea,#142b43e9);border:1px solid #efd08490;border-radius:17px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
.hudBrand{font-size:12px;letter-spacing:2px;font-weight:900;color:#e8c36a}
.hudSmall{font-size:10px;letter-spacing:1px;color:#a8c3cd;text-transform:uppercase;font-weight:850}
#activeName{font-size:22px;font-weight:900;line-height:1.13;margin:6px 0 2px;white-space:nowrap}
#activeCash{font-size:23px;color:#ffedb9;font-weight:950;letter-spacing:-.8px}
#roster{padding-top:9px;margin-top:10px;border-top:1px solid #ffffff29;display:grid;gap:5px}
.rPlayer{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800;color:#d7e8df}
.rPlayer .dot{width:10px;height:10px;border-radius:50%;background:var(--player);display:inline-block;margin-right:5px}
.rPlayer em{font-size:11px;font-weight:700;color:#efd99c;font-style:normal}
.rPlayer.now{color:#fff}
#roundStamp{margin-top:9px;font-weight:900;color:#dfc08a;font-size:12px}
#hudActions{margin-top:8px;display:flex;gap:5px}
#viewActions{margin-top:6px;display:flex;gap:5px}
#viewActions .miniBtn{min-height:30px;padding:6px 3px;white-space:nowrap;font-size:10px}
#viewActions .miniBtn[aria-pressed=true]{background:#ecd18b;color:#172738;border-color:#ffe4a8}
#matchSetup[hidden]{display:none!important}
#matchSetup{position:fixed;inset:0;z-index:110;display:grid;place-items:center;background:#061426d9;padding:8px 12px;backdrop-filter:blur(5px)}
#matchSetupPanel{width:min(455px,calc(100vw - 40px));max-height:calc(100dvh - 16px);overflow-y:auto;border:2px solid #f4cb76;border-radius:16px;background:linear-gradient(150deg,#123452,#0b2339);box-shadow:0 16px 50px #000b;padding:12px 15px;color:#fdf0cb}
#matchSetupPanel h2{font-size:18px;margin:0 0 3px}
#matchSetupPanel p{font-size:11px;color:#cbd9de;margin:3px 0 10px}
#matchSetupPanel .matchFields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
#matchSetupPanel label{font-size:11px;font-weight:850;display:grid;gap:4px}
#matchSetupPanel select{min-width:0;min-height:36px;border:1px solid #eaca86;border-radius:9px;background:#18384c;color:#fff8df;font-size:13px;padding:5px}
#matchSetupPanel .matchButtons{display:flex;gap:10px;margin-top:11px}
#matchSetupPanel .matchButtons button{flex:1;min-height:38px;border:1px solid #f1cf82;border-radius:9px;background:#ecd08a;color:#162d40;font-weight:900}
#matchSetupPanel .matchButtons button.secondary{background:#17344b;color:#f2f0e5}
@media(max-width:720px){#matchSetupPanel{padding:8px}#matchSetupPanel .matchFields{gap:5px}#matchSetupPanel select{font-size:11px}}

.miniBtn{border:1px solid #d8c59376;background:#0e2945d9;border-radius:12px;color:#fff4dc;padding:8px;font-size:11px;font-weight:850;flex:1;box-shadow:0 3px 7px #06142768}
#actionSide{position:absolute;right:max(13px,env(safe-area-inset-right));top:max(13px,env(safe-area-inset-top));bottom:max(10px,env(safe-area-inset-bottom));width:205px;z-index:60;display:flex;flex-direction:column;gap:7px}
#actionCard{border-radius:17px;padding:13px 13px 10px;background:linear-gradient(150deg,#13263ded,#172f46ef);border:1px solid #efc8758c;box-shadow:var(--shadow);overflow-y:auto;max-height:100%;scrollbar-width:thin}
#actionCard h2{font-size:17px;font-weight:950;margin:0 0 6px;color:#fff4d2}
.victoryClock{border:1px solid #ffdc79;border-radius:10px;background:#3a3025;color:#ffecb9;padding:7px 8px;font-size:11px;line-height:1.3;margin:6px 0 8px}
.victoryClock b{color:#fff5da}
.resultsList{display:grid;gap:5px;max-height:27vh;overflow-y:auto}
.resultRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 7px;border-left:4px solid var(--player);border-radius:5px;background:#2547629e;padding:5px 7px}
.resultRow strong,.resultRow b{font-size:11px}
.resultRow small{grid-column:1/-1;color:#d1dfdc;font-size:10px}
#actionCard p{font-size:12px;margin:7px 0;line-height:1.3;color:#d5e2e5}
.tag{font-size:10px;color:#eec67a;letter-spacing:1.3px;font-weight:900}
.actionBtn{display:block;width:100%;margin:8px 0 0;padding:12px 9px;border:1px solid #e8c271;border-radius:12px;background:linear-gradient(#ffdb81,#efb64a);box-shadow:0 5px 0 #a56f2e,0 8px 14px #0b1b29;color:#192d3d;font-size:16px;font-weight:950;text-transform:uppercase}
.actionBtn.secondary{padding:10px 7px;background:#18344c;border-color:#6e8b93;box-shadow:0 3px #061b30;color:#eef2e9;font-size:12px}
.actionBtn.coral{background:linear-gradient(#f6ae83,#e47752);box-shadow:0 5px #a64c34}
.routeControls{display:flex;gap:7px;margin:9px 0}
.routeControls button{flex:1;padding:10px 3px;border-radius:10px;border:1px solid #7896a1;background:#20354a;color:#eff5ee;font-size:11px;font-weight:900}
.routeControls button.chosen{background:#d5ae5a;color:#1f2b36;border-color:#ffe0a2}
#eventToast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:70;background:#0e2336e8;border:1px solid #e6c17799;border-radius:15px;padding:10px 14px;max-width:50vw;text-align:center;box-shadow:var(--shadow);font-size:13px;font-weight:800;color:#f6ecdb;pointer-events:none;opacity:0;transition:opacity .25s}
#eventToast.show{opacity:1}
#selectedCard{margin-top:7px;border:1px solid #89a19b88;background:#0a2037bf;padding:9px 10px;border-radius:12px}
#selectedCard h3{font-size:14px;margin:0 0 3px;color:#ffe2a7}
#selectedCard .desc{font-size:11px;color:#d9e7df;line-height:1.35}
#selectedCard .badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
#selectedCard .badges span{background:#31546a;padding:3px 7px;border-radius:8px;color:#e9f3eb;font-size:10px;font-weight:850}
.buildList{max-height:clamp(105px,28vh,200px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 5px 7px 0}
#topRibbon{position:absolute;top:9px;left:50%;transform:translateX(-50%);padding:5px 17px;border-radius:20px;background:#0d2239c7;border:1px solid #edc7786b;z-index:48;font-size:11px;letter-spacing:1.1px;font-weight:900;color:#ffe3a5;pointer-events:none}
#previewMark{position:absolute;bottom:7px;left:10px;z-index:70;font-size:10px;color:#fff4ce;font-weight:850;letter-spacing:.45px;text-decoration:none;pointer-events:auto;cursor:pointer;padding:5px 7px;border:1px solid #d9bc8570;border-radius:8px;background:#132c43cf}#previewMark:focus-visible{outline:2px solid #ffe8ad;outline-offset:2px}
#dice{display:flex;justify-content:center;gap:8px;margin:10px 0 6px}
.die{background:#fff4db;color:#123050;width:35px;height:35px;display:grid;place-items:center;border:2px solid #aa8153;border-radius:7px;box-shadow:3px 4px 0 #73553d;font-size:24px;font-weight:950}
#controlsInfo{font-size:10px;color:#c0d2cf;margin-top:9px;text-align:center}
@media(max-width:800px){#hud{width:143px}#actionSide{width:162px}#activeName{font-size:17px}#activeCash{font-size:20px}.hudCard{padding:9px}#actionCard{padding:10px}#actionCard h2{font-size:15px}.actionBtn{padding:10px 5px;font-size:13px}#topRibbon{top:4px;font-size:9px}#selectedCard{padding:7px}}
@media(max-height:365px){#hud{top:5px}#roundStamp{margin-top:4px}#actionSide{top:5px}#roster{gap:1px;padding-top:3px;margin-top:4px}#actionCard{padding:7px}.hudBrand{font-size:10px}#hudActions{margin-top:3px}#topRibbon{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>

<body>
<div id="game">
 <div id="tableViewport" aria-label="Interactive Skyline Estates tabletop board">
  <div id="boardStage">
   <div id="board"><div id="innerGarden"></div><div id="parkTrees"><i class="tree"></i><i class="tree"></i><i class="tree"></i><i class="tree"></i></div><div id="parkLogo"><b>SKYLINE</b><small>ESTATES</small></div>
   <div class="skybridge h" id="bridgeTL"></div><div class="skybridge h" id="bridgeTR"></div><div class="skybridge h" id="bridgeBR"></div><div class="skybridge h" id="bridgeBL"></div>
   <div id="tiles"></div><div class="tokenDock" id="tokens"></div></div>
  </div>
 </div>
 <div id="topRibbon">SKYLINE CIRCUIT · LIVING CITY</div>
 <aside id="hud"><div class="hudCard"><div class="hudBrand">SKYLINE ESTATES</div><div class="hudSmall" id="activeLabel">YOUR TURN</div><div id="activeName">You</div><div id="activeCash">SC 1,500</div><div id="roundStamp">Round 1</div><div id="roster"></div></div><div id="hudActions"><button class="miniBtn" id="zoomOut" title="Zoom out">− Zoom</button><button class="miniBtn" id="zoomIn" title="Zoom in">+ Zoom</button><button class="miniBtn" id="centerBtn">Center</button></div><div id="viewActions"><button class="miniBtn" id="detailBtn" aria-pressed="false" title="Zoom in to a selected property">Inspect</button><button class="miniBtn" id="overviewBtn" title="Restore whole-board camera">Full board</button><button class="miniBtn" id="matchBtn" title="Configure a new Circuit match">Match</button></div></aside>
 <aside id="actionSide"><div id="actionCard" aria-live="polite"></div><div id="selectedCard"></div></aside>
 <div id="matchSetup" role="dialog" aria-modal="true" aria-labelledby="matchSetupTitle" hidden><div id="matchSetupPanel">
 <h2 id="matchSetupTitle">New Skyline Circuit match</h2><p>Choose your match. Your existing game is only replaced when you press Start.</p>
 <form id="matchForm"><div class="matchFields">
 <label>Length<select id="matchLength"><option value="standard">Standard · 40</option><option value="extended">Extended · 60</option><option value="quick">Quick · 30</option></select></label>
 <label>Rivals<select id="matchOpponents"><option value="1">1 CPU</option><option value="2">2 CPU</option><option value="3" selected>3 CPU</option></select></label>
 <label>Difficulty<select id="matchDifficulty"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard*</option></select></label>
 </div><p>*Hard currently uses the same route planning as Normal. Quick is experimental.</p>
 <div class="matchButtons"><button type="button" id="matchCancel" class="secondary">Keep playing</button><button type="submit" id="matchStart">Start new match</button></div></form>
 </div></div>
 <div id="eventToast" role="status"></div><a id="previewMark" href="./index.html" aria-label="Return to Skyline Estates">← SKYLINE ESTATES</a>
</div>
<script src="./lib/circuit-rules.js"></script>
<script src="./circuit-tabletop-life.js"></script>
<script>
(function(){
"use strict";
var SC=window.SkylineCircuit;if(!SC){document.querySelector("#actionCard").textContent="Circuit rules are unavailable";return;}
var params=new URLSearchParams(location.search),wantsCareer=params.get("career")==="1";
var careerEnabled=false;
try{careerEnabled=localStorage.getItem("skylineFeature.career")==="on"&&localStorage.getItem("skylineFeature.circuitAlpha")==="on"}catch(e){}
var CAREER_MODE=wantsCareer&&careerEnabled;
if(wantsCareer&&!CAREER_MODE){
 document.querySelector("#actionCard").innerHTML='<h2>Career unavailable</h2><p>Skyline Career and Circuit preview must both be enabled to play a qualifying Career match. Your existing Circuit save is untouched.</p><a href="./index.html" class="actionBtn secondary">Back to Skyline Estates</a>';
 document.querySelector("#matchBtn").disabled=true;
 document.querySelector("#lifeMotionToggle").disabled=true;
 return;
}
var PREVIEW_SAVE=CAREER_MODE?SC.SAVE_KEY:"skylineCircuitTabletopRebootSave";
var COLORS=["#f58653","#4d93de","#42bd88","#b774e0"];
var DISTRICTS=["Harbour Quarter","Civic Heights","Garden Mile","Neon Exchange"];
var ACCENTS=["#1e99c2","#efc04b","#39a66b","#e77755"];
var STREET={
O1:"Marina Avenue",O2:"Ocean View",O4:"Seabreeze Drive",O6:"City Centre",O7:"Sunrise Row",O9:"Grand Arcade",O11:"Parkside Walk",O12:"Garden Boulevard",O14:"Maple Quay",O16:"Skyline Way",O17:"The Promenade",O19:"Rooftop Avenue",
I1:"Harbour Plaza",I2:"Pier Heights",I4:"Civic Crown",I5:"Golden Mile",I7:"Canopy Square",I8:"Emerald Terrace",I10:"Neon Towers",I11:"Lantern Lane"
};
var CORNERS={O0:["Skyline Station","🚏"],O5:["City Exchange","🏙️"],O10:["Grand Terminal","🚍"],O15:["Harbour Gateway","⚓"],I0:["Marina Link","🌉"],I3:["Civic Link","🌉"],I6:["Garden Link","🌉"],I9:["Metro Link","🌉"]};
var EVENT_NAMES={O3:"City Event",O8:"City Event",O13:"City Event",O18:"City Event"};
var $=function(q){return document.querySelector(q)};
var escapeHTML=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];})};
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},put:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var s=null,selected="O0",plan="stay",busy=false,aiRunning=false,visualPos={},tiles={},lastDice=[1,1],zoom=.62,panX=0,panY=-8,drag=null,suppressClickUntil=0,toastTimer=null,pinch=null,detailMode=false,overviewZoom=.62;
var completedCareer=new Set();
function completeCareer(){
 if(!CAREER_MODE||!s||!s.over||!s.meta||!s.meta.career||!s.meta.matchId||completedCareer.has(s.meta.matchId))return false;
 var id=s.meta.matchId;
 var receipt=SC.careerFacts(s,{ownerSeat:0,endedAt:Date.now()});
 var key="skylineCareerInbox:"+id,payload=JSON.stringify(receipt);
 // Commit the Career receipt BEFORE clearing the original Circuit save.
 // A full/blocked localStorage must never silently discard a finished match.
 try{
  localStorage.setItem(key,payload);
  if(localStorage.getItem(key)!==payload)throw Error("receipt verification failed");
 }catch(err){
  toast("Career result could not be saved. Keep this game open and check Safari storage.");
  return false;
 }
 // Same ownership boundary as Circuit Alpha: after a career match completes,
 // only its Circuit save is cleared; Career imports the receipt on next launch.
 store.del(PREVIEW_SAVE);
 completedCareer.add(id);
 return true;
}
var corners=function(n){var out=[];for(var x=0;x<n-1;x++)out.push([x,0]);for(var y=0;y<n-1;y++)out.push([n-1,y]);for(var x=n-1;x>0;x--)out.push([x,n-1]);for(var y=n-1;y>0;y--)out.push([0,y]);return out;};
var outer=corners(6),inner=corners(4);var locations={};
outer.forEach(function(p,i){locations["O"+i]=[70+p[0]*112,70+p[1]*112]});
inner.forEach(function(p,i){locations["I"+i]=[182+p[0]*112,182+p[1]*112]});
function nameOf(id){return (CORNERS[id]||[])[0]||EVENT_NAMES[id]||STREET[id]||"Skyline Property";}
function fmt(v){return Math.round(v||0).toLocaleString("en-US")}
function toast(msg){var n=$("#eventToast");n.textContent=msg;n.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){n.classList.remove("show")},2800)}
function button(label,action,cls,extra){return '<button class="actionBtn '+(cls||"")+'" data-action="'+action+'" '+(extra||"")+'>'+label+'</button>';}
function ringLabel(id){return id.charAt(0)==="I"?"Inner Boulevard":"City Boulevard"}
function boardCreate(){var root=$("#tiles");root.innerHTML="";
 SC.NODES.forEach(function(n){
   var el=document.createElement("button");el.type="button";el.className="tile";el.dataset.node=n.id;
   el.setAttribute("aria-label",nameOf(n.id));var xy=locations[n.id];el.style.left=xy[0]+"px";el.style.top=xy[1]+"px";
   var code=n.type==="property"?"property":n.type==="event"?"event":"special";el.classList.add(code);if(n.type==="property")el.classList.add("district"+n.quadrant);
   el.style.setProperty("--district",ACCENTS[n.quadrant]);
   var innerHTML='<div class="stripe"></div>';
   if(n.type!=="property")innerHTML+='<div class="specialIcon">'+(n.type==="event"?"★":(CORNERS[n.id]||[])[1]||"✦")+'</div>';
   innerHTML+='<div class="name">'+escapeHTML(nameOf(n.id))+'</div>';
   if(n.type==="property")innerHTML+='<div class="lot"></div><div class="towers"></div><div class="price">SC '+fmt(n.price)+'</div><div class="ownerBand" hidden></div>';
   if(n.type==="junction")innerHTML+='<div class="price">SKY BRIDGE</div>';
   if(n.type==="event")innerHTML+='<div class="price">PICK A CARD</div>';
   el.innerHTML=innerHTML;
   el.addEventListener("click",function(){if(Date.now()<suppressClickUntil)return;selected=n.id;paintTiles();renderSelected();if(detailMode)inspectSelected();});
   el.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){selected=n.id;paintTiles();renderSelected();}});
   tiles[n.id]=el;root.appendChild(el);
 });
}
function camera(){var st=$("#boardStage");
 st.style.transform="translate(-50%,-50%) translate("+Math.round(panX)+"px,"+Math.round(panY)+"px) rotateX("+(detailMode?12:29)+"deg) rotateZ("+(detailMode?-1:-3)+"deg) scale("+zoom+")";
 st.classList.toggle("detailInspect",detailMode);
 $("#detailBtn").setAttribute("aria-pressed",String(detailMode));
}
function inspectSelected(){
 if(!s)return;var p=locations[selected];
 detailMode=true;zoom=Math.max(1.14,zoom);
 if(p){panX=(360-p[0])*zoom*.82;panY=(360-p[1])*zoom*.74;}camera();
}
function showFullBoard(){detailMode=false;zoom=overviewZoom;center(false);}
function center(onToken){panX=0;panY=-8;
 if(onToken&&s){var p=locations[visualPos[0]||s.players[0].pos];if(p){panX=(360-p[0])*zoom*.75;panY=(360-p[1])*zoom*.5}}
 camera();}
// Frame the complete board between the player HUD and action panel on every landscape viewport.
function fitCamera(){
 var avail=window.innerWidth-$("#hud").offsetWidth-$("#actionSide").offsetWidth-56;
 zoom=Math.max(.48,Math.min(1.02,(window.innerHeight-45)/630,Math.max(250,avail)/800));
 overviewZoom=zoom;detailMode=false;center(false);
}
function focusMovingPlayer(pid){if(!s)return;var p=locations[visualPos[pid]||s.players[pid].pos];if(!p)return;panX=(360-p[0])*zoom*.75;panY=(360-p[1])*zoom*.5;camera();}
function paintTiles(){if(!s)return;var v=SC.view(s);v.nodes.forEach(function(n){var tile=tiles[n.id];if(!tile)return;
 tile.classList.toggle("selected",selected===n.id);tile.classList.toggle("current",v.players[v.turn]&&v.players[v.turn].pos===n.id);
 if(n.type!=="property")return;
 var o=n.owner;tile.classList.toggle("owned",o>=0);tile.style.setProperty("--owner",o>=0?COLORS[o]:"#b9a982");
 var band=tile.querySelector(".ownerBand");band.hidden=o<0;
 var model=tile.querySelector(".towers"),stage=o>=0&&n.stage>0?n.stage:0;
 // Do not recreate a miniature on every render: persistent DOM keeps its 3D edges
 // and building-growth animation stable during focus, movement and panel updates.
 if(Number(tile.dataset.stage||0)!==stage){
  model.replaceChildren();
  if(stage){var building=document.createElement("div");building.className="model level"+stage;model.appendChild(building);}
  tile.dataset.stage=String(stage);
 }
 tile.querySelector(".lot").style.display=stage?"none":"block";
 });}
function paintTokens(){if(!s)return;var root=$("#tokens");
 s.players.forEach(function(p,i){var pos=locations[visualPos[i]||p.pos];if(!pos)return;
 // Preserve the same DOM pawn so its position interpolates during every real rules step.
 var tok=root.querySelector('.pawn[data-player="'+i+'"]');
 if(!tok){tok=document.createElement("div");tok.dataset.player=i;root.appendChild(tok);}
 tok.className="pawn"+(s.turn===i?" turn":"");tok.style.setProperty("--player",COLORS[i]);
 tok.style.left=(pos[0]+(i%2?11:-11))+"px";tok.style.top=(pos[1]+(i<2?-9:11))+"px";tok.title=p.name;
 });
}
function renderRoster(){if(!s)return;var v=SC.view(s),current=v.players[v.turn],p=s.players[s.turn];
 $("#activeLabel").textContent=p.ai?"COMPUTER TURN":"YOUR TURN";$("#activeName").textContent=p.name;
 $("#activeCash").textContent="SC "+fmt(p.cash);$("#roundStamp").textContent="Round "+v.round+" of "+v.rounds;
 $("#roster").innerHTML=v.players.map(function(x){return '<div class="rPlayer '+(x.id===v.turn?"now":"")+'" style="--player:'+COLORS[x.id]+'"><span><i class="dot"></i>'+escapeHTML(x.name)+'</span><em>'+fmt(x.influence)+' pts</em></div>'}).join("");
}
function renderSelected(){if(!s)return;var v=SC.view(s),n=v.nodes.find(function(z){return z.id===selected});if(!n)return;var html='<h3>'+escapeHTML(nameOf(n.id))+'</h3><div class="desc">';
 if(n.type==="property"){html+=escapeHTML(DISTRICTS[n.quadrant])+' · '+ringLabel(n.id)+'</div><div class="badges"><span>SC '+fmt(n.price)+'</span><span>'+(n.owner<0?"For sale":escapeHTML(s.players[n.owner].name))+'</span><span>'+(n.owner<0?"Land plot":n.stageName)+'</span></div>';
 if(n.owner>=0)html+='<div class="desc" style="margin-top:7px">Rent SC '+fmt(n.rent)+'</div>';}
 else html+=n.type==="event"?"Draw a City Event when you land here.":"Use the skyline bridge to travel between boulevards."+'</div>';
 $("#selectedCard").innerHTML=html;
}
function renderActions(){if(!s)return;var v=SC.view(s),pd=SC.pending(s),me=s.players[s.turn],human=!me.ai&&!busy;
 var html='<div class="tag">SKYLINE CIRCUIT · '+(CAREER_MODE?"CAREER":"BOARD 1 · PRACTICE")+'</div>';
 if(CAREER_MODE&&(!s.meta||!s.meta.career))html+='<div class="victoryClock">This older saved match was started as practice. It will not be recorded as a Career result.</div>';
 if(v.clock&&!s.over){
  var contender=s.players[v.clock.pid];
  html+='<div class="victoryClock" role="status"><b>'+escapeHTML(contender.name)+'</b> leads the circuit. Keep the lead until the end of round '+v.clock.winsAtEndOfRound+' to win.</div>';
 }
 if(s.over){
  var ordered=v.players.slice().sort(function(a,b){return b.influence-a.influence||b.netWorth-a.netWorth});
  html+='<h2>🏆 '+escapeHTML(s.players[s.winner].name)+' wins!</h2>';
  html+='<p>Final results · '+v.round+' rounds · '+(s.endReason==="round-limit"?"round limit":s.endReason==="last-solvent"?"last player standing":"influence lead")+'</p>';
  html+='<div class="resultsList">'+ordered.map(function(p,i){return '<div class="resultRow" style="--player:'+COLORS[p.id]+'"><strong>'+(i+1)+'. '+escapeHTML(p.name)+'</strong><b>'+fmt(p.influence)+' pts</b><small>SC '+fmt(p.netWorth)+' value</small></div>'}).join("")+'</div>';
  if(CAREER_MODE)html+='<p>Completed Career matches are recorded when you return to Skyline Estates.</p><a href="./index.html" class="actionBtn secondary">Return to Career</a>';
  html+=button("Play again","new","coral");
}
 else if(me.ai||busy){html+='<h2>'+(busy?"On the move":"Computer turn")+'</h2><p>Watch the pieces move along the board. Your next turn starts automatically.</p>'; }
 else if(pd&&pd.type==="roll"){
  html+='<h2>Ready to roll?</h2><p>Choose a street or take the bridge when you reach a junction.</p>';
  html+='<div class="routeControls"><button data-action="stay" class="'+(plan==="stay"?"chosen":"")+'">Boulevard</button><button data-action="cross" class="'+(plan==="cross"?"chosen":"")+'">Sky Bridge</button></div>';
  html+='<div id="dice"><div class="die">'+lastDice[0]+'</div><div class="die">'+lastDice[1]+'</div></div>';
  html+=button("🎲 Roll dice","roll","");}
 else if(pd&&pd.type==="route"){
  html+='<h2>Choose your route</h2><p>'+escapeHTML(nameOf(pd.at))+' · '+pd.steps+' spaces remaining</p>';
  html+=button("Stay on boulevard","route:stay","")+button("Take Sky Bridge","route:cross","secondary");
 }
 else if(pd&&pd.type==="buy"){
  selected=pd.node;
  html+='<h2>'+escapeHTML(nameOf(pd.node))+'</h2><p>Available property · SC '+fmt(pd.price)+'</p>';
  html+=button("Buy property","buy","")+button("Pass","pass","secondary");
 }
 else if(pd&&pd.type==="build"){
  html+='<h2>Build or finish</h2><p>Upgrade your properties or end your turn.</p>';
  var opts=pd.options.filter(function(x){return x.type==="build"});
  if(opts.length)html+='<div class="buildList" aria-label="Available property upgrades">'+opts.map(function(b){return button("Build "+escapeHTML(nameOf(b.node))+" · SC "+fmt(b.cost),"build:"+b.node,"secondary")}).join("")+'</div>';
  html+=button("End turn","end","coral");
 }else html+='<h2>Player turn</h2><p>Waiting for the next move.</p>';
 html+='<div id="controlsInfo">Drag to explore the board · tap a property to inspect</div>';
 var side=$("#actionCard");if(side.dataset.state!==html){side.innerHTML=html;side.dataset.state=html;}
 side.querySelectorAll("[data-action]").forEach(function(b){b.addEventListener("click",function(){actUI(b.dataset.action)})});
}
function render(){if(!s)return;renderActions();paintTiles();paintTokens();renderRoster();renderSelected();if(window.SkylineCircuitLife)window.SkylineCircuitLife.reflect(SC.view(s));}
function sleep(ms){return new Promise(function(resolve){setTimeout(resolve,ms)})}
async function perform(action){if(busy||!s||s.over)return;var pd=SC.pending(s);if(!pd||pd.player!==s.turn)return;
 busy=true;var start=Object.assign({},visualPos),turnBefore=s.turn;
 try{
  SC.act(s,pd.player,action);
  // Commit the authoritative move before playing visual steps: reloading Safari mid-animation must not roll back a purchase or roll.
  store.put(PREVIEW_SAVE,SC.serialize(s));
  var events=SC.drain(s),lifeEvents=[];
  var d=events.find(function(e){return e.t==="roll"});if(d)lastDice=d.dice;
  for(var k=0;k<events.length;k++){
    var e=events[k];
    if(e.t==="step"){visualPos[e.pid]=e.to;paintTokens();await sleep(e.via==="connector"?185:140);}
    else if(e.t==="buy"){toast(nameOf(e.node)+" purchased!");lifeEvents.push({kind:"buy",node:e.node});}
    else if(e.t==="build"){toast(nameOf(e.node)+" upgraded!");lifeEvents.push({kind:"build",node:e.node});}
    else if(e.t==="rent")toast("Rent paid · SC "+fmt(e.amount));
    else if(e.t==="card"){toast("City Event · "+String(e.card).replace(/-/g," "));lifeEvents.push({kind:"card",node:e.node||s.players[pd.player].pos});}
  }
  s.players.forEach(function(p,i){visualPos[i]=p.pos});
  if(events.some(function(e){return e.t==="step"}))focusMovingPlayer(pd.player);
  if(s.turn!==turnBefore)plan="stay";
  selected=s.players[s.turn].pos;render();
  if(window.SkylineCircuitLife)lifeEvents.forEach(function(ev){window.SkylineCircuitLife.pulse(ev.kind,ev.node)});
  if(s.over)completeCareer();
 }catch(err){visualPos=start;toast("Move could not complete: "+err.message);console.error(err);}
 finally{busy=false;render()}
 if(!s.over)kickAI();
}
async function aiLoop(){
 try{
  var count=0;
  while(s&&!s.over&&!busy&&s.players[s.turn].ai&&count++<45){
   await sleep(280);
   var pd=SC.pending(s);if(!pd||!s.players[pd.player].ai)break;
   var move=SC.ai(s,pd.player);if(!move)break;
   await perform(move);
  }
 }finally{aiRunning=false;}
}
function kickAI(){if(!s||s.over||busy||aiRunning)return;if(s.players[s.turn].ai){aiRunning=true;aiLoop().catch(function(e){console.error(e);toast("Computer move stopped");aiRunning=false})}}
function actUI(a){
 if(a==="new"){openMatchSetup();return;}
 if(a==="stay"||a==="cross"){plan=a;renderActions();return;}
 if(a==="roll"){perform({type:"roll",via:plan});return;}
 if(a==="route:stay"||a==="route:cross"){perform({type:"route",via:a.split(":")[1]});return;}
 if(a==="buy"||a==="pass"||a==="end"){perform({type:a});return;}
 if(a.indexOf("build:")===0){perform({type:"build",node:a.slice(6)});return;}
}
function start(fresh,settings){var raw=fresh?null:store.get(PREVIEW_SAVE),parsed=raw?SC.restore(raw):null;
 if(parsed&&parsed.ok)s=parsed.state;
 else{
  var length=settings&&["standard","extended","quick"].includes(settings.length)?settings.length:["standard","extended","quick"].includes(params.get("length"))?params.get("length"):"standard";
  var count=settings&&Number.isInteger(settings.count)?Math.max(1,Math.min(3,settings.count)):3;
  var level=settings&&["easy","normal","hard"].includes(settings.level)?settings.level:"normal";
  var players=[{name:"You"}];
  ["Kofi","Mei","Lucas"].slice(0,count).forEach(function(name){players.push({name:name,level:level})});
  var seed=new Uint32Array(1);try{crypto.getRandomValues(seed)}catch(e){seed[0]=Date.now()>>>0}
  var meta=null;if(CAREER_MODE){var startedAt=Date.now();
   meta={matchId:"circuit-"+seed[0].toString(36)+"-"+startedAt.toString(36),startedAt:startedAt,career:true};
  }
  s=SC.newMatch({seed:seed[0],length:length,fx:true,players:players,meta:meta});
  // Career mode shares the authoritative Circuit save key with the original
  // alpha, while practice mode remains in a completely independent slot.
 }
 SC.drain(s);
 // Save the match settings and starting state, not just the first roll.
 // A reload before the first action must keep chosen CPU difficulty and length.
 store.put(PREVIEW_SAVE,SC.serialize(s));
 visualPos={};for(var i=0;i<s.players.length;i++)visualPos[i]=s.players[i].pos;
 $("#tokens").replaceChildren(); // clear retired player tokens when reducing the number of opponents
 selected=s.players[s.turn].pos;busy=false;plan="stay";lastDice=[1,1];render();fitCamera();if(s.over)completeCareer();else kickAI();
}
function openMatchSetup(){
 if(busy||aiRunning){toast("Finish the current move before changing match settings");return}
 var panel=$("#matchSetup");
 $("#matchLength").value=s&&s.cfg.length||(["standard","extended","quick"].includes(params.get("length"))?params.get("length"):"standard");
 $("#matchOpponents").value=String(s?Math.max(1,s.players.length-1):3);
 $("#matchDifficulty").value=s&&s.players[1]&&s.players[1].level||"normal";
 panel.hidden=false;$("#matchLength").focus();
}
function closeMatchSetup(){$("#matchSetup").hidden=true;$("#matchBtn").focus();}
$("#matchBtn").addEventListener("click",openMatchSetup);
$("#matchCancel").addEventListener("click",closeMatchSetup);
$("#matchSetup").addEventListener("click",function(e){if(e.target===e.currentTarget)closeMatchSetup()});
$("#matchForm").addEventListener("submit",function(e){
 e.preventDefault();if(busy||aiRunning){toast("Finish the current move first");return}
 var cfg={length:$("#matchLength").value,count:Number($("#matchOpponents").value),level:$("#matchDifficulty").value};
 // In Career mode, an explicitly confirmed New Match replaces only the
 // Circuit alpha save key, exactly as the existing Circuit setup does.
 // Practice mode still uses only the isolated tabletop key.
 store.del(PREVIEW_SAVE);
 $("#matchSetup").hidden=true;start(true,cfg);
});

$("#zoomIn").addEventListener("click",function(){zoom=Math.min(1.55,zoom+.12);camera()});
$("#zoomOut").addEventListener("click",function(){zoom=Math.max(.48,zoom-.12);camera()});
$("#centerBtn").addEventListener("click",function(){center(true)});
$("#detailBtn").addEventListener("click",function(){inspectSelected()});
$("#overviewBtn").addEventListener("click",function(){showFullBoard()});
var viewport=$("#tableViewport");
viewport.addEventListener("pointerdown",function(e){if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,cx:panX,cy:panY,moved:false};if(!e.target.closest(".tile"))viewport.setPointerCapture(e.pointerId);});
viewport.addEventListener("pointermove",function(e){if(!drag||pinch)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5){drag.moved=true;viewport.classList.add("dragging");}panX=drag.cx+dx;panY=drag.cy+dy;camera();});
viewport.addEventListener("pointerup",function(){if(drag&&drag.moved)suppressClickUntil=Date.now()+200;drag=null;viewport.classList.remove("dragging")});
viewport.addEventListener("pointercancel",function(){drag=null;viewport.classList.remove("dragging")});
function touchDistance(t){var dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy)}
viewport.addEventListener("touchstart",function(e){if(e.touches.length===2){pinch={distance:Math.max(1,touchDistance(e.touches)),zoom:zoom};drag=null}},{passive:true});
viewport.addEventListener("touchmove",function(e){if(!pinch||e.touches.length!==2)return;e.preventDefault();zoom=Math.max(.48,Math.min(1.55,pinch.zoom*touchDistance(e.touches)/pinch.distance));camera();suppressClickUntil=Date.now()+300;},{passive:false});
viewport.addEventListener("touchend",function(e){if(e.touches.length<2)pinch=null},{passive:true});
