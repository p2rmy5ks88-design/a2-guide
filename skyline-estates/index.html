<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Skyline Estates"><meta name="theme-color" content="#10223f"><script src="../eko-estates/firebase-config.js"></script><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Skyline Estates</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: full-screen 3D island board in daylight; player badges float down the left, tools top-right, a big round action button bottom-right */
:root{
  --sky1:#2f8fdc; --sky2:#8fd0f7; --sky3:#e3f5ff;
  --navy:#13284a; --text:#13284a; --muted:#5a6d84;
  --panel:#ffffff; --panel2:#eef3f8; --line:#d5dee8;
  --danfo:#ffc61a; --danfo-ink:#3a2700; --danfo-deep:#c98f00;
  --green:#12884a; --good:#17a35a; --bad:#e2412f; --night:#13284a;
  --display:'Lilita One','Arial Rounded MT Bold','Arial Black',sans-serif;
  --body:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  --ease:cubic-bezier(.3,.75,.25,1);
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;color:var(--text);font-family:var(--body);
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font-family:var(--body);cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* game overlay */
#ui{position:fixed;inset:0;pointer-events:none;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#ui>*{pointer-events:auto}
#roster{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:max(10px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;max-height:calc(100% - 64px);overflow:auto;scrollbar-width:none;padding:2px 12px 2px 2px}
.pcard{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px;border:none;background:rgba(255,255,255,.93);box-shadow:0 3px 0 rgba(19,40,74,.18);text-align:left;transition:transform .35s var(--ease),box-shadow .35s;min-width:0}
.pcard.cur{transform:translateX(8px) scale(1.04);box-shadow:0 0 0 3px var(--danfo),0 5px 0 rgba(19,40,74,.25)}
.pcard.out{opacity:.45;filter:grayscale(1)}
.pt{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:21px/1 var(--emoji);background:var(--pc);border:3px solid #fff;box-shadow:0 0 0 2px var(--pc)}
.pinfo{min-width:0}
.pn{font-weight:800;font-size:11.5px;color:var(--muted);display:flex;gap:4px;align-items:center;white-space:nowrap;max-width:118px;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:9px;font-weight:800;letter-spacing:.05em;padding:1px 5px;border-radius:5px;background:var(--panel2);color:var(--muted)}
.tag.jail{background:var(--bad);color:#fff}
.pc{font:18px/1.05 var(--display);color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.pg{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px;max-width:118px}
.pg i{width:6px;height:6px;border-radius:2px;display:block}

#tools{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:max(10px,env(safe-area-inset-top,0px));display:flex;gap:8px}
.tb{width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(19,40,74,.2);display:grid;place-items:center;color:var(--navy)}
.tb svg{width:22px;height:22px}
.tb:disabled{opacity:.45;cursor:default}
.tb.on{background:var(--navy);color:#fff}

#prompt{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(44vw,420px);padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(19,40,74,.18);font-size:13.5px;line-height:1.25;text-align:center;text-wrap:balance}
#prompt:empty{display:none}
#prompt b{font-weight:800}
#prompt .sub{display:block;font-size:11.5px;color:var(--muted)}
#toast{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top,0px)) + 58px);transform:translate(-50%,-8px);max-width:min(60vw,460px);padding:9px 16px;border-radius:14px;background:var(--danfo);color:var(--danfo-ink);font-weight:800;font-size:14px;text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 4px 0 var(--danfo-deep)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#banner{position:absolute;left:0;right:0;top:38%;display:flex;justify-content:center;pointer-events:none}
#banner .bn{font:clamp(26px,5vw,52px)/1 var(--display);color:#fff;padding:12px 30px 10px;border-radius:18px;background:var(--pc);display:flex;gap:14px;align-items:center;letter-spacing:.02em;
  text-shadow:0 3px 0 rgba(0,0,0,.25);box-shadow:0 0 0 5px #fff,0 10px 0 5px rgba(19,40,74,.25);animation:ban 1.35s var(--ease) forwards}
.bn .bt{width:1.25em;height:1.25em;border-radius:50%;background:#fff;display:grid;place-items:center;font:.8em/1 var(--emoji)}
@keyframes ban{0%{transform:scale(.4) rotate(-6deg);opacity:0}18%{transform:scale(1.06) rotate(-2deg);opacity:1}30%,78%{transform:scale(1) rotate(-2deg)}100%{transform:scale(.9) translateY(-30px);opacity:0}}

#acts{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pill{padding:10px 16px;border-radius:999px;border:none;background:#fff;color:var(--navy);font-weight:800;font-size:13.5px;box-shadow:0 3px 0 rgba(19,40,74,.22)}
.pill:disabled{opacity:.5}
.bigb{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:var(--danfo);color:var(--danfo-ink);font:16px/1 var(--display);letter-spacing:.03em;box-shadow:0 5px 0 var(--danfo-deep),0 8px 14px rgba(19,40,74,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;animation:breathe 1.8s ease-in-out infinite}
.bigb svg{width:24px;height:24px}
.bigb.end{background:#fff;color:var(--navy);box-shadow:0 5px 0 #b9c6d6,0 8px 14px rgba(19,40,74,.25);font-size:14px;animation:none}
.bigb:active{transform:translateY(4px);box-shadow:0 2px 0 var(--danfo-deep)}
@keyframes breathe{50%{transform:scale(1.06)}}
#log{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(46vw,440px);padding:7px 14px;border-radius:999px;border:none;background:rgba(19,40,74,.72);color:#fff;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log:empty{display:none}
#round{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.9);font:14px var(--display);color:var(--navy);letter-spacing:.03em;box-shadow:0 3px 0 rgba(19,40,74,.18)}

/* floaters */
.float{position:fixed;z-index:60;font:18px var(--display);pointer-events:none;animation:fl 1.4s ease-out forwards;text-shadow:0 2px 0 #fff,0 0 6px #fff}
.float.plus{color:var(--good)}.float.minus{color:var(--bad)}
@keyframes fl{0%{transform:translateY(6px);opacity:0}15%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.note{position:fixed;z-index:59;width:34px;height:20px;border-radius:4px;background:#2fa866;border:2px solid #e6ffe9;color:#fff;font:12px/16px var(--display);text-align:center;pointer-events:none;box-shadow:0 2px 4px rgba(0,0,0,.25)}

/* modals */
#modals{position:fixed;inset:0;z-index:40;pointer-events:none}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(19,40,74,.35);pointer-events:auto;animation:fade .2s;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov.bye{animation:fade .2s reverse forwards}
@keyframes fade{from{opacity:0}}
.mp{background:#fff;color:var(--text);border-radius:22px;padding:14px 16px;max-width:min(440px,100%);width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 0 rgba(19,40,74,.18),0 18px 40px rgba(19,40,74,.3);animation:rise .32s var(--ease)}
.mp.wide{max-width:min(760px,100%)}
@keyframes rise{from{transform:translateY(18px) scale(.95)}}
.mbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mbar .btn{flex:1 1 auto}
.mh{font:22px/1.1 var(--display);color:var(--navy);letter-spacing:.01em}
.mtxt{font-size:14px;line-height:1.4}
.mtxt.muted,.muted{color:var(--muted);font-size:12.5px}
.row2{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
.row2>*{min-width:0}
.sidecol{flex:1;min-width:170px;display:flex;flex-direction:column;gap:10px}
.sidecol .mbar{flex-direction:column;align-items:stretch;margin-top:auto}
.btn{padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--navy);font-weight:800;font-size:14px}
.btn.pri{background:var(--danfo);border-color:var(--danfo);color:var(--danfo-ink);box-shadow:0 4px 0 var(--danfo-deep)}
.btn.pri:active{transform:translateY(3px);box-shadow:0 1px 0 var(--danfo-deep)}
.btn.danger{border-color:#f3c3bd;color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}

/* deed */
.deed{width:196px;flex:none;background:#fffdf6;color:#1b150c;border-radius:12px;padding:7px;border:2px solid #e9e1cc}
.deed .dh{background:var(--gc);border:2px solid #1b150c;padding:6px 6px 7px;text-align:center;border-radius:4px}
.deed .dh small{display:block;font:800 9px var(--body);letter-spacing:.14em}
.deed .dh b{display:block;font:17px/1.05 var(--display);margin-top:2px;letter-spacing:.01em}
.deed .dl{font-size:10.5px;font-weight:700;text-align:center;opacity:.65;margin:4px 0 2px}
.deed table{width:100%;border-collapse:collapse;font-size:11px;line-height:1.22;font-variant-numeric:tabular-nums}
.deed td{padding:0 2px}.deed td:last-child{text-align:right;font-weight:800}
.deed .sep td{border-top:1px solid #0002;padding-top:4px}
.deed .own{margin-top:4px;text-align:center;font-weight:800;font-size:12px}

/* game card */
.gcard{perspective:900px;width:min(320px,100%);height:176px;margin:0 auto}
.gflip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s var(--ease)}
.gflip.go{transform:rotateY(180deg)}
.gside{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.gback{font:34px var(--display);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.gback.chance{background:#13a36b}.gback.esusu{background:#2e6fd6}
.gfront{transform:rotateY(180deg);background:#fffdf6;color:#1b150c;font-size:15px;font-weight:700;line-height:1.35;border:5px solid var(--dc)}
.gfront b{font:15px var(--display);letter-spacing:.05em;margin-bottom:8px;color:var(--dc)}

/* assets + trade */
.alist{display:flex;flex-direction:column;gap:5px}
.arow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:12px;background:var(--panel2)}
.arow>i{width:10px;height:28px;border-radius:3px;display:block}
.arow .an{font-weight:800;font-size:13px;min-width:0}
.arow .an small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.arow .ab{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.sm{padding:6px 9px;border-radius:9px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:11.5px;white-space:nowrap;color:var(--navy)}
.sm.go{border-color:#9fd9b8;color:var(--green)}
.sm.warn{border-color:#f2d27a;color:#9a6a00}
.sm:disabled{opacity:.35}
.debt{padding:8px 10px;border-radius:12px;background:#fdecea;color:#7a1d12;font-size:13px}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcol{min-width:0;background:var(--panel2);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.tcol h4{margin:0;font:13px var(--display);color:var(--muted);letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.pchip{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:var(--navy)}
.pchip i{width:9px;height:9px;border-radius:50%;display:block;flex:none}
.pchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.step{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.step output{min-width:66px;text-align:center;font:15px var(--display);font-variant-numeric:tabular-nums}
.who{display:flex;gap:6px;flex-wrap:wrap}
.who button{display:flex;gap:6px;align-items:center;padding:4px 10px 4px 4px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:12.5px;color:var(--navy)}
.who button.on{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc)}
.who span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--pc);font:13px var(--emoji)}
.sumt{font-size:13.5px;line-height:1.55}
.sumt b{color:var(--green)}
.auc .now{font:32px var(--display);color:var(--green);font-variant-numeric:tabular-nums}
.auc .lead{font-weight:800;font-size:12.5px;color:var(--muted)}
.auc .bidders{display:flex;gap:6px;flex-wrap:wrap}
.auc .bidders span{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#fff;border:2px solid var(--pc)}
.auc .bidders span.out{opacity:.35;text-decoration:line-through}
.auc .msg{font-size:13px;min-height:18px}
.stand{display:flex;flex-direction:column;gap:6px}
.stand div{display:grid;grid-template-columns:28px 32px 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-radius:12px;background:var(--panel2);font-weight:800}
.stand div:first-child{background:var(--danfo);color:var(--danfo-ink)}
.stand em{font:17px var(--display);font-style:normal}
.stand i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--pc);font:16px var(--emoji);font-style:normal;border:2px solid #fff}
.loglist{display:flex;flex-direction:column;gap:4px;font-size:12.5px;max-height:60vh;overflow:auto}
.loglist div{padding:4px 8px;border-radius:8px;background:var(--panel2)}

/* title */
#title{position:fixed;inset:0;z-index:30;overflow:auto;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(90deg,rgba(19,40,74,.45),rgba(19,40,74,.05) 50%,rgba(19,40,74,.25))}
.tgrid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.2fr);gap:22px;max-width:1100px;margin:0 auto;min-height:100%;align-items:center}
.brand .e{font:clamp(64px,13vw,140px)/.82 var(--display);color:var(--danfo);letter-spacing:.02em;
  text-shadow:-3px -3px 0 var(--navy),3px -3px 0 var(--navy),-3px 3px 0 var(--navy),3px 3px 0 var(--navy),0 10px 0 var(--navy)}
.brand .s{display:inline-block;margin-top:14px;font:clamp(22px,3.8vw,38px)/1 var(--display);background:var(--green);color:#fff;padding:8px 16px 6px;border-radius:10px;letter-spacing:.06em;box-shadow:0 0 0 4px #fff,0 8px 0 4px rgba(19,40,74,.35);transform:rotate(-3deg)}
.brand p{color:#fff;font-size:14px;font-weight:700;line-height:1.45;max-width:36ch;margin:22px 0 14px;text-shadow:0 1px 3px rgba(19,40,74,.6)}
.brand .row{display:flex;gap:8px;flex-wrap:wrap}
.setup{background:rgba(255,255,255,.96);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 0 rgba(19,40,74,.2)}
.setup h3{margin:0;font:13px var(--display);letter-spacing:.06em;color:var(--muted)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{display:flex;gap:6px;align-items:center;padding:5px;border-radius:14px;background:var(--panel2);min-width:0}
.slot.off{opacity:.5}
.slot .tok{flex:none;width:38px;height:38px;border-radius:50%;border:3px solid #fff;background:var(--pc);font:20px/1 var(--emoji);box-shadow:0 0 0 2px var(--pc)}
.slot input{flex:1;min-width:0;width:100%;background:transparent;border:none;border-bottom:2px solid var(--line);color:var(--navy);font:800 13px var(--body);padding:4px 2px}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;flex:none;background:#fff}
.seg button{border:none;background:transparent;padding:6px 8px;font-weight:800;font-size:11px;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.opts{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.opts .seg{justify-self:start}
.small{font-size:11.5px;color:var(--muted);line-height:1.4}
.rules{font-size:13px;line-height:1.5}
.rules h4{margin:10px 0 2px;font:14px var(--display);color:var(--green);letter-spacing:.02em}
.rules p{margin:0}
.err{padding:12px;border-radius:14px;background:#fdecea;color:#7a1d12;font-weight:700}

#rotate{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:#fff;color:var(--navy);padding:10px 12px;border-radius:14px;font-weight:800;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 rgba(19,40,74,.25);width:max-content;max-width:calc(100% - 32px)}
#rotate button{border:none;background:var(--navy);color:#fff;border-radius:9px;padding:6px 12px;font-weight:800}
#confetti{position:fixed;inset:0;z-index:45;pointer-events:none}

@media (orientation:portrait){
  .tgrid{grid-template-columns:minmax(0,1fr)}
  .slots{grid-template-columns:minmax(0,1fr)}
  #prompt{top:auto;bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 112px);max-width:70vw}
  #log{display:none}
}
@media (max-height:420px){
  .pcard{padding:3px 12px 3px 3px}.pt{width:32px;height:32px;font-size:17px}.pc{font-size:16px}
  .bigb{width:68px;height:68px;font-size:14px}.bigb svg{width:20px;height:20px}.bigb.end{font-size:12.5px}
  .tb{width:42px;height:42px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

/* ---- v3 additions ---- */
#roster{top:calc(max(10px,env(safe-area-inset-top,0px)) + 46px);max-height:calc(100% - 160px);padding-top:12px}
.tgrid{align-items:start}.brand{position:sticky;top:0;padding-top:8px}
#tools{flex-direction:column;top:calc(max(10px,env(safe-area-inset-top,0px)) + 58px)}
#acts{flex-direction:row;align-items:flex-end;z-index:2}
#ui:has(#acts .pills) #log{display:none}
#acts .pills .pill{font-size:14px;padding:12px 18px}
#acts .pills{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pill.pri{background:var(--danfo);color:var(--danfo-ink);box-shadow:0 3px 0 var(--danfo-deep)}
#ui{z-index:3}

.pcard{position:relative}

.rav{position:relative;flex:none;width:40px;height:40px;border-radius:50%;background:#dfe9f5;overflow:hidden;box-shadow:0 0 0 2px var(--danfo)}
.rav .csvg{display:block}
.rav .rl{position:absolute;right:-2px;bottom:-2px;width:18px!important;height:18px!important;font-size:10px!important;font-style:normal;box-shadow:0 0 0 2px #fff!important}
.uname{font:700 15px var(--body);padding:7px 10px;border-radius:10px;border:2px solid var(--line);width:100%;max-width:220px;color:var(--navy);background:#fff;user-select:text;-webkit-user-select:text}
.profcard{flex-direction:row;align-items:center;gap:12px}
.pav{flex:none;width:64px;height:64px;border-radius:50%;background:#dfe9f5;overflow:hidden;box-shadow:0 0 0 3px var(--danfo)}
.pinf{display:flex;flex-direction:column;gap:4px;min-width:0}
.castsel{flex-direction:row;align-items:center;gap:12px}
.cbig2{flex:none;width:88px;height:88px;border-radius:20px;background:linear-gradient(160deg,#e8f0fa,#c8d8ec);overflow:hidden}
.castgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ccard{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 5px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--navy);text-align:center}
.ccard .csvg{border-radius:50%;background:#e8f0fa}
.ccard b{font-size:13px}.ccard small{font-size:10px;color:var(--muted);line-height:1.25}
.ccard em{position:absolute;top:4px;right:4px;font-style:normal;font-size:9.5px;font-weight:800;background:var(--green);color:#fff;padding:1px 6px;border-radius:999px}
.ccard.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy)}
.ccard.locked .csvg{filter:grayscale(1) brightness(.6)}
.pane.tab-cast{flex:0 0 min(50%,460px)}
.cabinet{display:flex;gap:6px;flex-wrap:wrap}
.tcab{flex:1;min-width:84px;display:flex;flex-direction:column;align-items:center;padding:6px;border-radius:12px;background:#fff;border:2px solid var(--line)}
.tcab i{font:24px/1 var(--emoji);font-style:normal}.tcab b{font:17px var(--display)}.tcab small{font-size:10.5px;color:var(--muted);font-weight:700}
.tcab.tp{border-color:#9fd2f0;background:#eef8ff}.tcab.tg{border-color:#f2d27a;background:#fff7d6}
.ach .trophy.tp,.ach .trophy.tg,.ach .trophy.ts,.ach .trophy.tb{font-size:22px}
.achpop.tp{background:linear-gradient(90deg,#e8f6ff,#fff)}.achpop.tg{background:linear-gradient(90deg,#fff3c8,#fff)}
.crole{font:800 11px var(--body)!important;letter-spacing:.08em;text-transform:uppercase;color:#7a5200!important}
.cbig2 .csvg,.pav .csvg{display:block}
.ccard .csvg{border-radius:12px}
.okmsg{color:var(--green)!important;font-weight:800}.errmsg{color:var(--bad)!important;font-weight:800}
#sPromo{text-transform:uppercase;letter-spacing:.06em}
.rar{display:inline-block;padding:1px 7px;border-radius:999px;color:#fff;font:800 10px var(--body);letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
.tem.r2{background:radial-gradient(circle at 40% 35%,#e3efff,#2f7fe0)!important;box-shadow:0 4px 0 #1f5aa8!important}
.tem.r3{background:radial-gradient(circle at 40% 35%,#f1e3ff,#8f3fd8)!important;box-shadow:0 4px 0 #5f2a96!important}
.tem.r4{background:radial-gradient(circle at 40% 35%,#fff7d6,#e2b13c)!important;box-shadow:0 4px 0 #9a6f10,0 0 14px rgba(242,193,74,.7)!important}
.lvpips i{width:34px}
.tlv{color:#fff!important}
.tem.r5{background:radial-gradient(circle at 40% 35%,#ffd8d8,#b3122f)!important;box-shadow:0 4px 0 #6a0a1c,0 0 16px rgba(255,58,42,.75)!important;animation:ember 1.6s ease-in-out infinite}
.tem.r6{background:conic-gradient(from 0deg,#ff3f6c,#ffb02e,#6be38b,#3fd0ff,#8f3fd8,#ff3f6c)!important;box-shadow:0 4px 0 #2a1048,0 0 18px rgba(143,63,216,.8)!important;animation:chaos 4s linear infinite}
@keyframes ember{50%{box-shadow:0 4px 0 #6a0a1c,0 0 26px rgba(255,120,42,.95)}}
@keyframes chaos{to{filter:hue-rotate(360deg)}}
.lvpips i{width:24px!important}
/* ================= MIDNIGHT AND GOLD THEME ================= */
:root{
  --ink:#EEF2F8;--ink2:#C7D3E3;--mute:#9FB0C8;--bg0:#0B1424;--bg1:#0E1A2E;--bg2:#13213A;--bg3:#1C2E4D;--ln:#22324F;--ln2:#2A3F63;
  --gold:#E2B54A;--gold2:#F3CF76;--goldd:#9A6F10;--goldgrad:linear-gradient(180deg,#F3CF76,#D9A53A);
  --display:'Outfit','Segoe UI',system-ui,sans-serif;--body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
  --danfo:#E2B54A;--danfo-ink:#1A1406;--danfo-deep:#9A6F10;
  --panel:#13213A;--panel2:#182844;--line:#22324F;--text:#EEF2F8;--muted:#9FB0C8;
  --green:#3FBF7F;--good:#3FBF7F;--bad:#FF6B5B;
  color-scheme:dark;
}
body{background:radial-gradient(120% 140% at 75% 30%,#1E3354 0%,#0E1A2E 55%,#0A1322 100%);color:var(--ink);font-family:var(--body)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.small{color:var(--mute)}

/* ---- home shell ---- */
#title{background:none}
.home{gap:0;padding:0;background:linear-gradient(90deg,rgba(11,20,36,.97) 0%,rgba(14,26,46,.92) 60%,rgba(14,26,46,.84) 100%);height:100%;box-sizing:border-box}
.home.peek-r{background:linear-gradient(90deg,rgba(11,20,36,.97) 0%,rgba(14,26,46,.93) 55%,rgba(14,26,46,.08) 72%,rgba(14,26,46,0) 100%)}
.rail{width:auto;flex:none;align-items:center;gap:6px;padding:max(14px,env(safe-area-inset-top,0px)) 10px max(14px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:#0B1424;border-right:1px solid #1F2E48}
.logomark{width:44px;height:44px;border-radius:12px;background:var(--goldgrad);color:#0E1A2E;display:flex;align-items:center;justify-content:center;margin-bottom:8px;flex:none}
.rail .tabs{align-items:center;gap:4px;overflow-y:auto}
.rail .grow{flex:1}
.tab{width:74px;flex-direction:column;gap:4px;padding:9px 0 8px;border-radius:14px;background:transparent;color:var(--mute);font:700 11px/1.1 var(--body);text-shadow:none;text-align:center;justify-content:center}
.tab svg{flex:none}
.tab.on{background:var(--bg3);color:var(--gold2);box-shadow:inset 3px 0 0 var(--gold)}
.tab .dot{right:12px;top:8px;margin:0;background:var(--bad);box-shadow:0 0 0 2px #0B1424}
.gear{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center;flex:none}
.gear.on{color:var(--gold2);border-color:var(--gold)}
.hmain{flex:1;min-width:0;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) 18px;gap:10px;min-height:0}
.topbar{display:flex;align-items:center;gap:10px;flex:none}
.topbar .grow{flex:1}
.topbar .who{display:flex;align-items:center;gap:10px;border:none;background:none;color:var(--ink);padding:0;text-align:left;min-width:0}
.topbar .rav{width:40px;height:40px;box-shadow:0 0 0 2px var(--gold);background:#1C2E4D}
.topbar .ri{display:flex;flex-direction:column;gap:4px;min-width:0}
.topbar .ri b{font:800 14px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.topbar .ri b small{font-weight:700;font-size:12px;color:var(--mute)}
.topbar .xpbar{width:160px;height:5px;margin:0}
.tpill{display:flex;align-items:center;gap:7px;padding:6px 10px 6px 8px;border-radius:999px;background:var(--bg2);border:1px solid var(--ln);color:var(--ink);font:800 13px var(--body);flex:none}
.tpill svg{color:var(--gold)}
.tpill .plus{width:20px;height:20px;border-radius:50%;background:var(--gold);color:#0E1A2E;display:flex;align-items:center;justify-content:center}
.tpill .plus svg{color:#0E1A2E}
.coinpill{background:none;border:none;padding:0;color:var(--ink);font-size:13px;gap:6px}
.coinpill i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE7A3,#C9962E);display:block}
.coinpill b{color:var(--ink)}
.pane{background:transparent;box-shadow:none;border-radius:0;padding:2px 2px 14px;color:var(--ink);gap:12px}
.pane.tab-cast{flex:0 0 min(54%,500px)}
.phead h2{font:700 24px var(--display);color:var(--ink);letter-spacing:-.005em}
.pane h3{font:800 11px var(--body);letter-spacing:.14em;color:var(--mute)}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;flex:none}
.stab{height:34px;padding:0 15px;border-radius:999px;border:1px solid var(--ln);background:var(--bg2);color:var(--ink2);font:800 13px var(--body)}
.stab.on{border-color:var(--gold);background:#2A2414;color:var(--gold2)}
.subpane{display:flex;flex-direction:column;gap:12px;min-width:0}
.subpane>.phead h2{display:none}
.subpane>.phead:has(.small:only-child){justify-content:flex-end}
.shoptabs{gap:8px}
.backbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--ln);background:var(--bg2);color:var(--ink);display:flex;align-items:center;justify-content:center}
.phead:has(.backbtn){justify-content:flex-start}
.phead:has(.backbtn) .citychip{margin-left:auto}

/* ---- play hero ---- */
.playgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;min-height:min(300px,100%);flex:1}
.hero{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--ln2);display:flex;flex-direction:column;justify-content:flex-end;padding:20px;min-height:250px;background:#0F1F37}
.heroart{position:absolute;inset:0;background:var(--sw);opacity:.9}
.heroart::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,26,46,.15) 0%,rgba(14,26,46,.55) 45%,rgba(11,20,36,.96) 100%)}
.heroart .sky{position:absolute;left:0;right:0;bottom:90px;height:112px;display:flex;align-items:flex-end;gap:6px;padding:0 22px;opacity:.55;z-index:1}
.heroart .sky i{display:block;background:#0E1A2E;border-radius:2px 2px 0 0}
.herotxt{position:relative;z-index:2;display:flex;flex-direction:column;gap:4px}
.eyebrow{font:800 12px var(--body);letter-spacing:.14em;color:var(--gold2)}
.herotxt h2{margin:0;font:700 40px/1 var(--display);color:#fff;letter-spacing:-.01em}
.herotxt p{margin:0;font-size:13px;color:var(--ink2)}
.herobtns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.playbtn{height:52px;padding:0 30px;border-radius:14px;border:none;background:var(--goldgrad);color:#1A1406;font:700 20px var(--display);letter-spacing:.02em;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(226,181,74,.35)}
.playbtn:active{transform:translateY(2px)}
.ghostbtn{height:52px;padding:0 18px;border-radius:14px;border:1px solid #5A7398;background:rgba(14,26,46,.55);color:var(--ink);font:800 14px var(--body)}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.mode{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;border:1px solid var(--ln);background:var(--bg2);color:var(--ink);text-align:left}
.mode .mi{width:38px;height:38px;flex:none;border-radius:11px;background:var(--bg3);color:var(--gold2);display:flex;align-items:center;justify-content:center}
.mode b{display:block;font:800 14px var(--body)}
.mode small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.mode:active{background:var(--bg3)}
.seasoncard{flex:1;min-height:76px;border-radius:16px;border:1px solid #3A3220;background:linear-gradient(135deg,#2A2414,#13213A 70%);padding:12px 14px;display:flex;flex-direction:column;gap:6px;justify-content:center;color:var(--ink);text-align:left}
.seasoncard .sh{display:flex;justify-content:space-between;gap:8px}
.seasoncard .sh b{font:800 12px var(--body);color:var(--gold2);letter-spacing:.04em}
.seasoncard small{font-size:12px;color:var(--ink2)}
.seasoncard .sh small{color:var(--mute)}

/* ---- shared controls ---- */
.card{background:var(--bg2);border:1px solid var(--ln);border-radius:16px}
.ch{font:700 15px var(--display);color:var(--ink)}
.ch small{color:var(--mute)}
.btn{background:var(--bg2);border:1px solid var(--ln2);color:var(--ink);border-radius:14px}
.btn.pri{background:var(--goldgrad);border-color:transparent;color:#1A1406;box-shadow:0 6px 18px rgba(226,181,74,.25)}
.btn.pri:active{box-shadow:none}
.btn.big{font:700 18px var(--display)}
.btn.danger{border-color:#6A2A2A;color:#FF8A7A;background:#2A1418}
.sm{background:var(--panel2);border:1px solid var(--ln2);color:var(--ink);border-radius:10px}
.sm.go{border-color:var(--gold);color:var(--gold2);background:#2A2414}
.sm.warn{border-color:transparent;background:var(--goldgrad);color:#1A1406}
.seg{background:var(--bg1);border:1px solid var(--ln);border-radius:10px}
.seg button{color:var(--ink2);font:800 12px var(--body);padding:7px 10px}
.seg button.on{background:var(--gold);color:#1A1406}
.rchip{background:var(--bg1);border:1px solid var(--ln);color:var(--ink)}
.rchip small{color:var(--mute)}
.rchip.on{border-color:var(--gold);background:#2A2414;box-shadow:none}
.slot{background:var(--bg1);border:1px solid var(--ln)}
.slot input,.uname,.olme input,.olrow input{background:var(--bg1);border:1px solid var(--ln2);color:var(--ink)}
.slot .tok{border-color:#0E1A2E}
.opts span{color:var(--ink2)}
.startbar .small{color:var(--mute)}
.citychip{background:var(--bg2);border:1px solid var(--ln);color:var(--ink)}
.citychip small{color:var(--mute)}
.citychip em{color:var(--gold2)}
.xpbar,.ach .bar,.cprog .bar,.lvpips i{background:var(--ln)}
.xpbar i,.ach .bar i,.cprog .bar i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.ranks span{background:var(--bg2);border:1px solid var(--ln);color:var(--ink2)}
.ranks span.got{border-color:var(--gold);background:#2A2414;color:var(--gold2)}
.ranks span b{color:var(--mute)}

/* ---- lists and cards on home panes ---- */
.ach{background:var(--bg2);border:1px solid var(--ln)}
.ach.done{background:#221F15;border-color:#4A3E1E}
.ach b{color:var(--ink)}
.ach small{color:var(--mute)}
.ach .rw{color:var(--gold2)}
.atab{background:var(--bg2);border:1px solid var(--ln);color:var(--ink)}
.atab.on{border-color:var(--gold);background:#2A2414;color:var(--gold2)}
.citysel{background:var(--bg2);border:1px solid var(--ln);color:var(--ink2)}
.citysel select{color:var(--ink);background:var(--bg2)}
.bcity{background:var(--bg2);border:1px solid var(--ln)}
.bcity.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.bbody small{color:var(--mute)}
.chd b{color:var(--ink)}
.chd small{color:var(--mute)}
.tcard,.fcard,.ccard,.scard{background:var(--bg2);border:1px solid var(--ln);color:var(--ink)}
.tcard small,.fcard small,.ccard small,.scard>small{color:var(--mute)}
.tcard.on,.fcard.on,.ccard.on,.scard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.tcard em,.ccard em{background:var(--gold);color:#1A1406}
.tinfo small{color:var(--ink2)}
.tinfo small b{color:var(--ink)}
.tokhero{background:linear-gradient(160deg,#1C2E4D,#13213A 70%)}
.profcard,.castsel{background:var(--bg2)}
.pav,.cbig2{background:#1C2E4D}
.crole{color:var(--gold2)!important}
.lcard{background:var(--bg2);border:1px solid var(--ln)}
.lcard>i{display:none}
.lcard b{color:var(--ink)}
.lcard p{color:var(--ink2)}
.prof{background:var(--bg2);border:1px solid var(--ln);color:var(--ink)}
.plv{background:var(--bg3);color:var(--gold2);box-shadow:0 0 0 2px var(--gold)}
.pbtn{background:var(--bg1);border:1px solid var(--ln);color:var(--ink)}
.pbtn.ready{border-color:var(--gold);background:#2A2414}
.wheelcard{background:linear-gradient(135deg,#2A2414,#13213A 70%)}
.cityhead b{color:var(--ink)}
.cabinet .tcab{background:var(--bg2);border:1px solid var(--ln);color:var(--ink)}
.tcab small{color:var(--mute)}
.tcab.tp{background:#15263F;border-color:#3D6A99}.tcab.tg{background:#2A2414;border-color:#6A5520}
.lrung{background:var(--bg2);border:1px solid var(--ln)}
.lrung.got{background:#2A2414}
.lrung.on{border-color:var(--gold)}
.lrung small{color:var(--mute)}.lrung em{color:var(--gold2)}
.leaguehead small{color:var(--mute)}
.lbrow{background:var(--bg2);color:var(--ink)}
.lbrow.me{background:#2A2414;box-shadow:0 0 0 1px var(--gold)}
.seasonhead{background:linear-gradient(135deg,#2A2414,#13213A 70%)}
.stier{background:var(--bg3);color:var(--gold2)}
.trw{background:var(--bg2);border:1px solid var(--ln);color:var(--ink)}
.trw small{color:var(--mute)}
.trw.prem{background:linear-gradient(180deg,#2E2716,#221D10);border-color:#5A4A1E}
.trw.can{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.tier.got>em{color:var(--gold2)}.tier.next>em{color:var(--ink)}
.premtag{background:var(--goldgrad);color:#1A1406}
.rew{background:var(--bg1)}
.rew b{color:var(--gold2)}.rew.coin b{color:var(--gold2)}
.ptag{background:var(--gold);color:#1A1406}
.okmsg{color:#6BE3A0!important}
.uname{max-width:240px}

/* ---- modals ---- */
.ov{background:rgba(5,10,20,.62)}
.mp{background:#13213A;border:1px solid var(--ln2);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.45)}

.mtxt{color:var(--ink2)}

.pchip{background:var(--bg1);border:1px solid var(--ln);color:var(--ink)}
.pchip.on{border-color:var(--gold);background:#2A2414}
.who button{background:var(--bg1);border:1px solid var(--ln);color:var(--ink)}
.stand div{background:var(--bg1);color:var(--ink)}
.stand div:first-child{background:#2A2414;box-shadow:0 0 0 1px var(--gold)}
.loglist div{background:var(--bg1);color:var(--ink2)}
.tchip{background:var(--bg1);border:1px solid var(--ln);color:var(--ink)}
.tsum>div{background:var(--bg1);color:var(--ink)}
.auc,.bidders span{background:var(--bg1);color:var(--ink)}
.cashbar b{color:var(--ink)}
.hint{background:#2A2414;color:var(--gold2)}
.sqb{background:var(--bg1);border:1px solid var(--ln);color:var(--ink)}
.sqb:hover,.sqb:focus-visible{border-color:var(--gold)}
.olcard,.olitem,.seat{background:var(--bg1);border:1px solid var(--ln);color:var(--ink)}
.olcard h4{color:var(--ink)}
.theme{background:var(--bg1);border:1px solid var(--ln);color:var(--ink)}
.theme.on{border-color:var(--gold);background:#2A2414}
.qq{background:var(--bg1);color:var(--ink)}
.ahd{color:var(--ink)}
.mapm .chip{background:var(--bg1);color:var(--ink)}

/* ---- in-game HUD ---- */
.pcard{background:rgba(11,20,36,.9);border:1px solid rgba(255,255,255,.08);box-shadow:none;padding:4px 12px 4px 4px;border-radius:14px}
.pcard.cur{transform:translateX(6px);box-shadow:0 0 0 2px var(--gold)}
.pt{width:32px;height:32px;font-size:18px;border:2px solid #0E1A2E}
.pn{color:var(--ink2);font-size:11.5px}
.pc{font:700 16px/1.1 var(--display);color:var(--ink)}
.tag{background:#22324F;color:var(--ink2)}
#tools{gap:8px}
#camBtn,#bReact{display:none!important}
.tb{width:44px;height:44px;border-radius:14px;background:rgba(11,20,36,.9);border:1px solid rgba(255,255,255,.1);box-shadow:none;color:var(--ink)}
.tb.on{background:var(--gold);color:#1A1406}
#prompt{background:rgba(11,20,36,.92);color:var(--ink);box-shadow:none;border:1px solid rgba(255,255,255,.08)}

/* the game is always laid out in landscape; when a phone is held upright the page is rotated (html.rot), so undo the old portrait rules */
@media (orientation:portrait){
  .home{flex-direction:row}
  .rail{flex-direction:column;align-items:center;width:auto}
  .rail .tabs{flex-direction:column;overflow-x:hidden;overflow-y:auto}
  .tab{flex:none;flex-direction:column;gap:3px;padding:6px 0 5px;width:70px;font-size:11px}
  .slots{grid-template-columns:1fr 1fr}
  .endgrid{grid-template-columns:1fr 1fr}
  .olgrid{grid-template-columns:1fr 1.3fr}
  .tsum{grid-template-columns:1fr 1fr}
  #prompt{top:max(10px,env(safe-area-inset-top,0px));bottom:auto;max-width:min(44vw,420px)}
  #log{display:block}
  #log:empty{display:none}
  .prof{flex-wrap:nowrap}
}

/* ================= SHOP SHOWROOM AND SEASON TRACK ================= */
.shophead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none}
.shophead h2{margin:0;font:700 24px var(--display);color:var(--ink)}
.subpane .shophead h2{display:none}
.shoptabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.shoptabs .stab{flex:none;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--ln);background:var(--bg2);color:var(--ink2);font:800 12.5px var(--body);cursor:pointer}
.shoptabs .stab.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--bg2));color:var(--gold2)}
html.light .shoptabs .stab.on{color:#7A5200}
.shopbody{display:flex;flex-direction:column;gap:10px;flex:none}
.shopnote{margin-top:2px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.igrid.g6{grid-template-columns:repeat(3,minmax(0,1fr))}
.icard{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 10px 10px;border-radius:16px;color:var(--ink);text-align:center;min-width:0;
  background:var(--bg2);border:1px solid var(--ln);
  background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--rc) 32%,transparent),transparent 70%),linear-gradient(180deg,color-mix(in srgb,var(--rc) 22%,var(--bg2)),var(--bg2) 78%);
  border-color:color-mix(in srgb,var(--rc) 45%,var(--ln))}
.icard b{font:700 14px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.icard .itier{font-size:10.5px;font-weight:800;letter-spacing:.03em;color:color-mix(in srgb,var(--rc) 55%,var(--ink))}
.iwrap{height:54px;display:grid;place-items:center;margin-bottom:2px}
.ideal{position:absolute;top:8px;right:8px;padding:2px 8px;border-radius:999px;background:#3FBF7F;color:#06210F;font:800 10px var(--body);font-style:normal;z-index:1}
.ipv{position:absolute;top:7px;left:7px;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--ln2);background:color-mix(in srgb,var(--bg0) 70%,transparent);color:var(--ink2);font:800 10px var(--body);cursor:pointer;z-index:1}
.ibuy{margin-top:auto;width:100%;min-height:34px;border-radius:10px;border:1px solid var(--ln2);background:var(--bg1);color:var(--ink);font:700 15px var(--display);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.ibuy s{font:600 12px var(--body);color:var(--mute)}
.ibuy.use{background:color-mix(in srgb,var(--green) 18%,var(--bg1));border-color:color-mix(in srgb,var(--green) 55%,var(--ln2))}
.ibuy.cash{border:none;background:var(--goldgrad);color:#1A1406;box-shadow:0 3px 0 #9A6F10}
.iown,.ihow{margin-top:auto;min-height:36px;display:flex;align-items:center;justify-content:center;font:800 12px var(--body);color:var(--green)}
.ihow{color:var(--mute);font-weight:700;font-size:11px;line-height:1.2}
i.coin{display:inline-block;flex:none;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF2C2,#E2B54A 55%,#9A6F10);box-shadow:inset 0 0 0 1.5px #C9962E}
.ibtn{height:44px;padding:0 16px;border-radius:12px;font:800 14px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.ibtn.gold{border:none;background:var(--goldgrad);color:#1A1406;box-shadow:0 4px 0 #9A6F10}
.ibtn.gold span{display:inline-flex;align-items:center;gap:4px;font:700 15px var(--display)}
.ibtn.ghost{border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--bg2));color:var(--ink)}
/* item art, drawn from each item's real colours */
.iart{display:block;flex:none}
.iart.ball{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 52%,#000 145%);box-shadow:0 6px 14px rgba(0,0,0,.35)}
.iart.ball.big{width:62px;height:62px}
.iart.die{width:46px;height:46px;border-radius:10px;border:2px solid var(--e);box-sizing:border-box;box-shadow:0 6px 14px rgba(0,0,0,.35);
  background:radial-gradient(circle,var(--o) 0 30%,transparent 33%) 8% 8%/36% 36% no-repeat,radial-gradient(circle,var(--p) 0 26%,transparent 29%) 50% 50%/36% 36% no-repeat,radial-gradient(circle,var(--p) 0 26%,transparent 29%) 92% 92%/36% 36% no-repeat,var(--f)}
.iart.surr{width:84px;height:54px;border-radius:12px;box-shadow:0 6px 14px rgba(0,0,0,.35);
  background:linear-gradient(var(--p),var(--p)) 50% 50%/26px 26px no-repeat,linear-gradient(var(--r),var(--r)) 50% 50%/32px 32px no-repeat,radial-gradient(ellipse at 50% 50%,var(--b) 0 46%,var(--w) 47%)}
.iart.coins,.iart.coin1{position:relative;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF2C2,#E2B54A 55%,#9A6F10);box-shadow:inset 0 0 0 3px #C9962E,0 6px 14px rgba(0,0,0,.35)}
.iart.coin1{width:30px;height:30px;box-shadow:inset 0 0 0 2px #C9962E}
.iart.coin1.plus::after{content:'';position:absolute;right:-8px;bottom:-4px;width:14px;height:14px;border-radius:50%;background:#3FD0FF;box-shadow:0 0 8px #3FD0FF}
.iart.coins.n1{box-shadow:inset 0 0 0 3px #C9962E,10px -6px 0 -4px #E2B54A,0 6px 14px rgba(0,0,0,.35)}
.iart.coins.n2{box-shadow:inset 0 0 0 3px #C9962E,12px -6px 0 -4px #E2B54A,-12px -6px 0 -4px #D9A53A,0 6px 14px rgba(0,0,0,.35)}
.iart.coins.n3{width:54px;height:54px;box-shadow:inset 0 0 0 3px #C9962E,14px -8px 0 -4px #E2B54A,-14px -8px 0 -4px #D9A53A,0 -14px 0 -6px #F3CF76,0 0 22px rgba(226,181,74,.55)}
.iart.glyph{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--rc,#E2B13C) 60%,#fff),color-mix(in srgb,var(--rc,#E2B13C) 80%,#000))}
.iart.glyph svg{width:28px;height:28px;color:#fff}
.iart.glyph.bolt{--rc:#2F9FE0}
/* daily layout: bundle beside the picks */
.dshop{display:grid;grid-template-columns:minmax(200px,250px) minmax(0,1fr);gap:12px;align-items:start}
.dshop.nob{grid-template-columns:minmax(0,1fr)}
.dpicks{display:flex;flex-direction:column;gap:8px;min-width:0}
.dhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dhead h3{margin:0;font:700 16px var(--display);color:var(--ink)}
.dhead span{font-size:12px;font-weight:700;color:var(--mute)}
.dhead b{color:var(--gold2);font-variant-numeric:tabular-nums}
html.light .dhead b{color:#7A5200}
.bundle{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:20px;color:var(--ink);border:1px solid color-mix(in srgb,var(--gold) 50%,var(--ln));
  background:linear-gradient(165deg,color-mix(in srgb,var(--gold) 26%,var(--bg2)) 0%,var(--bg2) 60%);box-shadow:0 10px 30px color-mix(in srgb,var(--gold) 14%,transparent)}
.bundle .once{align-self:flex-start;padding:3px 10px;border-radius:999px;background:var(--gold);color:#1A1406;font:800 10.5px var(--body);letter-spacing:.08em}
.bundle h3{margin:0;font:700 20px/1.1 var(--display)}

/* ================= AVATAR FRAMES AND CITY CHAMPION ================= */
.avf{position:relative;display:inline-grid;place-items:center;border-radius:50%;padding:3px;isolation:isolate;flex:none;vertical-align:middle}
.avf::before{content:'';position:absolute;inset:0;border-radius:50%;z-index:-1;background:conic-gradient(var(--a,#E2B54A),var(--c,#E2B54A),var(--b,#fff),var(--c,#E2B54A),var(--a,#E2B54A));animation:avspin 5s linear infinite}
.avf::after{content:'';position:absolute;inset:-3px;border-radius:50%;z-index:-2;background:conic-gradient(transparent 0 72%,rgba(255,255,255,.85) 80%,transparent 88%);animation:avspin 2.4s linear infinite;filter:blur(1.5px)}
.avf>.rav,.avf>.pav{box-shadow:none!important;margin:0}
.avf.fr-city{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--a) 60%,transparent))}
.avf.fr-prism::before{background:conic-gradient(#FF3F6C,#FFB02E,#6BE38B,#3FD0FF,#8F3FD8,#FF3F6C);animation-duration:2.6s}
.avf.fr-prism{filter:drop-shadow(0 0 7px rgba(143,63,216,.65))}
.avf.fr-crown::before{background:conic-gradient(#FFF6D6,#E2B13C,#9A6F10,#F3CF76,#FFF6D6)}
.avf.fr-crown{filter:drop-shadow(0 0 9px rgba(226,181,74,.8))}
.avcrown{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:22px;height:13px;background:linear-gradient(180deg,#FFF2C2,#E2B13C);clip-path:polygon(0 100%,0 25%,25% 60%,50% 0,75% 60%,100% 25%,100% 100%);z-index:2}
@keyframes avspin{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.avf::before,.avf::after{animation:none}}
.pav.big{width:120px;height:120px}.pav.sm{width:44px;height:44px}.champsum .pav.sm{width:40px;height:40px}
.champcard{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;color:var(--ink);border:1px solid color-mix(in srgb,var(--gold) 40%,var(--ln));
  background:radial-gradient(ellipse at 0% 50%,color-mix(in srgb,var(--gold) 22%,transparent),transparent 60%),var(--bg2)}

.champcard .cci{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.champcard small{font:800 10.5px var(--body);letter-spacing:.1em;color:var(--gold2)}
html.light .champcard small{color:#7A5200}

.champcard span{font-size:12px;color:var(--ink2)}
.ccbar{display:block;height:8px;border-radius:999px;background:var(--bg0);border:1px solid var(--ln2);overflow:hidden;margin-top:2px}
.ccbar i{display:block;height:100%;border-radius:999px;background:var(--goldgrad)}
.champcard em{font:800 11.5px var(--body);font-style:normal;color:var(--mute)}
.champcard.got em{color:var(--green)}
.champsum{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--ln);color:var(--ink)}
.champsum b{display:block;font:700 15px var(--display)}.champsum small{font-size:12px;color:var(--mute)}
.frrow{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 4px}
.frchip{flex:none;width:92px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 8px;border-radius:14px;border:1px solid var(--ln);background:var(--bg2);color:var(--ink);cursor:pointer}

.frev{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.frev small{font:800 11px var(--body);letter-spacing:.12em;color:var(--gold2)}

.avf>.pav,.frchip .pav,.champsum .pav,.champcard .pav,.frev .pav{display:block;border-radius:50%;overflow:hidden;background:#1C2E4D}

/* the frame wraps the avatar at its own size (top-bar rules sized the wrapper as if it were an icon) */
#rprof .avf,.who .avf{width:auto!important;height:auto!important;min-width:0;padding:3px!important;box-sizing:content-box;flex:none;display:inline-grid;line-height:0}

/* bottom bar: the round chip never runs into the centred log message */
#log{max-width:min(46%,440px)}
#round{max-width:calc(50% - min(23%,220px) - 44px);box-sizing:border-box;white-space:normal;line-height:1.35;border-radius:16px}

function validTrade(t){const f=P(t.from),r=P(t.to);if(!f||!r||f.bankrupt||r.bankrupt)return false;

async function resolveTrade(t,depth=0){

    ok=k==='yes';if(k==='counter'){counter=await tradeEditor(r,{partner:f.id,pre:counterOf(t),title:`Counter offer to ${esc(f.name)}`,cta:'Send counter offer'});if(!counter)log(`${r.name} declined a deal from ${f.name}`)}}
  if(ok){executeTrade(t);return true}

function executeTrade(t){

function aiReserve(p){let threat=0;for(let i=0;i<40;i++){const o=G.own[i];if(o.o>=0&&o.o!==p.id&&!o.m&&SQ[i].t==='prop'&&!P(o.o).bankrupt)threat=Math.max(threat,o.h?SQ[i].r[o.h]:ownsAll(o.o,SQ[i].g)?SQ[i].r[0]*2:0)}

async function jailTurn(p){
  G.phase='jail';updateTools();let ch;
  if(p.ai){setPrompt(`<b>${esc(p.name)}</b> is in the Lockup…`);await sleep(700);ch=aiJailChoice(p)}
  else{const b=[{k:'roll',label:'Roll for doubles',primary:true}];b.push({k:'pay',label:p.cash>=BAIL?'Pay '+fmt(BAIL)+' bail':'Bail '+fmt(BAIL)+' (not enough cash)',disabled:p.cash<BAIL});if(p.goojf.length)b.push({k:'card',label:'Use Bail Pass'});
    ch=await actions(`<b>${esc(p.name)}</b>, you are in the Lockup.<span class="sub">Attempt ${p.jailTurns+1} of 3. Pay ${fmt(BAIL)} bail, use a Bail Pass, or roll doubles to walk free.</span>`,b)}
  G.phase='busy';updateTools();
  if(ch==='pay'){await pay(p,BAIL,null,'fee');p.inJail=false;p.jailTurns=0;log(`${p.name} paid bail`);toast(`${p.name} pays bail`);placeToken(p);renderRoster();return 'free'}
  if(ch==='card'){const c=p.goojf.pop();G[c.deck].push(c.idx);p.inJail=false;p.jailTurns=0;log(`${p.name} used a Bail Pass`);toast(`${p.name} walks out free`);placeToken(p);renderRoster();return 'free'}
  const d=await rollDice();
  if(d[0]===d[1]){p.inJail=false;p.jailTurns=0;toast('Doubles! Out of the Lockup');return{move:true,d}}
  p.jailTurns++;
  if(p.jailTurns>=3){toast('Third try failed. Pay '+fmt(BAIL)+' bail and move');await pay(p,BAIL,null,'fee');if(p.bankrupt)return 'stay';p.inJail=false;p.jailTurns=0;return{move:true,d}}
  toast(`${p.name} stays in the Lockup`);log(`${p.name} stays in the Lockup`);return 'stay';
}
async function playTurn(p){ttStart(p);try{await playTurnInner(p)}finally{ttStop()}}
async function playTurnInner(p){
  G.phase='busy';renderRoster();updateTools();setPrompt(`<b>${esc(p.name)}</b>${p.ai?' (AI) is playing…':'’s turn'}`);$('#acts')&&!FAST&&($('#acts').innerHTML='');
  if(!FAST){camOverview(p.pos,700);await banner(p)}
  let dbl=0;
  while(!G.over&&!p.bankrupt){
    if(p.inJail){const r=await jailTurn(p);if(p.bankrupt||r==='stay')break;
      if(r.move){placeToken(p);await moveSteps(p,r.d[0]+r.d[1]);await land(p,r.d);break}}
    G.phase='pre';updateTools();
    if(p.ai){setPrompt(`<b>${esc(p.name)}</b> (AI) is rolling…`);await sleep(500)}
    else{const hint=Object.keys(GROUPS).some(g=>ownsAll(p.id,g))?'<span class="sub">You own a full colour set. Build houses from Properties.</span>':'<span class="sub">Tap any square on the board to see its deed.</span>';
      await actions(`<b>${esc(p.name)}</b>, ${dbl?'roll again':'your turn'}.${hint}`,[{k:'roll',label:'🎲 Roll dice',primary:true}])}
    G.phase='busy';updateTools();

    await offerReroll(p,d);
    if(d[0]===d[1]){dbl++;if(dbl===3){st(p).dbl3=1;toast('Three doubles in a row. Speeding!');await sendToJail(p);break}}
    if(d.s!=null){const r=await speedResolve(p,d);if(r==='triples')break}else{await moveSteps(p,d[0]+d[1]);await land(p,d)}
    if(p.bankrupt||p.inJail||G.over||d[0]!==d[1])break;

  }

const RULES=`<div class="rules">
<h4>Goal</h4><p>Be the last landlord standing. Everyone else goes bankrupt, or you have the highest net worth when you end the game.</p>
<h4>Your turn</h4><p>Roll two dice and move. Passing Start pays your payday. Doubles roll again. Three doubles in a row sends you to the Lockup.</p>

  function token(force){if(tok&&!force&&Date.now()<exp-120000)return Promise.resolve(tok);if(!pending)pending=signIn().finally(()=>pending=null);return pending}
  const enc=p=>p.split('/').map(encodeURIComponent).join('/');

        const eq=filters.find(f=>f[1]==='==');const all=(await req('GET','games',undefined,eq?'&orderBy='+encodeURIComponent('"'+eq[0]+'"')+'&equalTo='+encodeURIComponent(JSON.stringify(eq[2])):'')).val||{};

          if(v.status==='lobby-sk'&&Date.now()-(v.at||0)>6*3600e3){purge(k).catch(()=>{});return}out.push({id:k,d:v})});
        return out.sort((a,b)=>(b.d.at||0)-(a.d.at||0)).slice(0,lim)}

    async get(){const rows=await this.fetchDocs();return mk(rows,[])},
    onSnapshot(next,err){let prev=new Set(),live=true,lastJ='';const self=this;

      if(top){const tick=async()=>{if(!live)return;try{emit(await self.fetchDocs())}catch(e){err&&err(e)}if(live)setTimeout(tick,4000)};tick();return()=>{live=false}}
      return stream(p,v=>{v=v||{};emit(Object.keys(v).filter(k=>v[k]!=null&&match(v[k],filters)).sort().slice(0,lim).map(k=>({id:k,d:v[k]})))},err)}}}
  function mk(rows,prev){const docs=rows.map(r=>snapDoc(r.id,r.d));return{docs,size:docs.length,empty:!docs.length,docChanges:()=>docs.filter(d=>!prev.has(d.id)).map(d=>({type:'added',doc:d}))}}
  async function purge(c){if(!/^[A-Z0-9]{5}$/.test(c))return;await Promise.all(['games/'+c,'sub/games~'+c,'locks/games~'+c].map(p=>req('DELETE',p).catch(()=>{})));if(uid)req('DELETE','usr/'+uid+'/'+c).catch(()=>{})}

const localHumans=()=>G.players.filter(p=>!p.ai&&!p.bankrupt&&(!G.online||p.uid===NET.me));
function achScan(){if(!trackable())return;for(const p of localHumans()){
  if(Object.keys(GROUPS).some(g=>ownsAll(p.id,g)))achAward('set');
  const towers=propsOf(p.id).filter(i=>G.own[i].h===5).length;if(towers)achAward('hotel');if(towers>=3)achAward('hotels3');
  if(RAILS.every(i=>G.own[i].o===p.id))achAward('transport');if(UTILS.every(i=>G.own[i].o===p.id))achAward('utils');
  if(netWorth(p)>=3000)achAward('billion');if((p.jailCount||0)>=3)achAward('jail3');
  const s=p.st||{};if((s.maxRent||0)>=500)achAward('rent500');if(s.bankrupted)achAward('takeover');if((s.bankrupted||0)>=3)achAward('takeover3');if(s.aucCheap)achAward('auction');if(Object.keys(GROUPS).filter(g=>ownsAll(p.id,g)).length>=3)achAward('sets3');if(propsOf(p.id).length>=10)achAward('land10');if(propsOf(p.id).filter(i=>G.own[i].m).length>=5)achAward('paper');if(s.dbl3)achAward('speeding')}}
function achGameEnd(winner){if(!trackable()||G.achDone)return;G.achDone=true;const hum=G.players.filter(p=>!p.ai&&(!G.online||p.uid===NET.me));if(!hum.length)return;const st=PREF.stats,c=G.set.city||'lagos',cc=countryOf(c).key;const won=winner&&hum.includes(winner);
  st.games++;if(!st.playedCities.includes(c))st.playedCities.push(c);if(!st.playedCountries.includes(cc))st.playedCountries.push(cc);if(G.online){st.onlineGames++;if(won)st.onlineWins++}
  {const rk=['ffa','events','speedDie','pot','goDouble','jailRent'].filter(k=>G.set[k]).length+(G.set.minigames?1:0);if(rk>=4)achAward('rules4')}
  if(won){const me=winner,ms=me.st||{};if(!ms.houses&&!ms.hotels)achAward('nohouse');if(ms.minCash!=null&&ms.minCash<100)achAward('comeback');if(G.set.mode==='classic'&&G.round<25)achAward('blitz');st.wins++;if(!st.winCities.includes(c))st.winCities.push(c);if(!st.winCountries.includes(cc))st.winCountries.push(cc);if(FFA())achAward('ffa_win');if(G.set.mode==='quick')achAward('quick');if(G.set.mode==='timed')achAward('timed')}
  savePref();achBump()}

function moveX(kind,k,n,t,o){
  if(kind==='horse'){o.y=Math.abs(Math.sin(k*Math.PI*2))*.07;o.mr=[0,0,Math.sin(k*Math.PI*4)*.12];(t.legs||[]).forEach(l=>{l.r=[0,0,Math.sin(k*Math.PI*4+l.ph)*.7]})}
  else if(kind==='canoe'){o.y=Math.sin(k*Math.PI*2)*.01;o.mr=[Math.sin(k*Math.PI*2+n)*.1,0,0];if(t.paddle)t.paddle.r=[Math.sin(k*Math.PI*2)*.8,0,Math.cos(k*Math.PI*2)*.4]}
  else if(kind==='barrel'){if(t.spin)t.spin.r=[0,0,-(n+k)*Math.PI*.9]}
  else if(kind==='mask'){o.y=Math.abs(Math.sin(k*Math.PI))*.16;o.yaw+=k*Math.PI*2*(n%2?1:-1);o.mr=[Math.sin(k*Math.PI*2)*.15,0,0]}
  else if(kind==='train'){o.y=Math.abs(Math.sin(k*Math.PI*4))*.006;if(t.puff){const u=(k*2)%1;t.puff.p=[.11-u*.15,.32+u*.25,0];t.puff.s=[.04+u*.06,.04+u*.06,.04+u*.06];t.puff.mat.a=.75*(1-u)}}
  else if(kind==='crown'){o.y=.18+Math.sin(k*Math.PI)*.12;o.yaw+=k*Math.PI;if(t.crown)t.crown.r=[0,k*Math.PI*2,Math.sin(k*Math.PI*2)*.1]}}

/* ---- board centre paint (flat art under the 3D pieces) ---- */
function paintKit(R){return (ctx,ph)=>{const rnd=seeded(R.seed||7);
  if(ph==='bg'){const gr=ctx.createLinearGradient(0,140,0,960);gr.addColorStop(0,R.ground[0]);gr.addColorStop(1,R.ground[1]);ctx.fillStyle=gr;ctx.fillRect(140,140,820,820);
    for(let k=0;k<220;k++){ctx.fillStyle=`rgba(${R.spec||'60,100,50'},${.08+rnd()*.12})`;ctx.beginPath();ctx.arc(150+rnd()*800,150+rnd()*800,5+rnd()*16,0,7);ctx.fill()}return}
  const W=R.water;ctx.save();
  if(W==='river'||W==='riverlow'){const y0=W==='river'?600:700;ctx.strokeStyle=R.wcol||'#3f86b8';ctx.lineWidth=46;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(300,y0+20);ctx.bezierCurveTo(430,y0-60,620,y0+80,800,y0-10);ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;for(let k=0;k<12;k++){const x=330+rnd()*440,y=y0-10+rnd()*30;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+16,y);ctx.stroke()}}
  if(W==='coast'||W==='bay'){ctx.fillStyle=R.sand||'#e8d6a6';ctx.fillRect(300,W==='bay'?600:690,500,16);const wg=ctx.createLinearGradient(0,700,0,820);wg.addColorStop(0,R.wcol||'#3db2df');wg.addColorStop(1,'#1f8fc4');ctx.fillStyle=wg;
    if(W==='bay'){ctx.beginPath();ctx.moveTo(300,616);ctx.bezierCurveTo(450,560,650,660,800,600);ctx.lineTo(800,820);ctx.lineTo(300,820);ctx.closePath();ctx.fill()}else ctx.fillRect(300,706,500,114)}
  if(W==='lake'){ctx.fillStyle=R.wcol||'#4f8fbf';ctx.beginPath();ctx.ellipse(550,740,250,70,0,0,7);ctx.fill()}
  if(W==='canals'){ctx.strokeStyle=R.wcol||'#3f7f9f';ctx.lineWidth=18;[[300,640,800,640],[440,460,440,820]].forEach(([a,b,c,d])=>{ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()})}

const MISSIONS=[
  {id:'buy5',n:'Buy 5 properties in one game',g:5,f:p=>st(p).buys},
  {id:'rent300',n:'Collect {m300} rent in one game',g:300,f:p=>st(p).rent,money:1},

  {id:'trade',n:'Complete a trade',g:1,f:p=>st(p).trades},
  {id:'go5',n:'Pass Start 5 times in one game',g:5,f:p=>st(p).go},

const MISSION_XP=150,MISSION_COINS=30;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const dayNum=s=>{const[a,b,c]=s.split('-').map(Number);return Math.round(new Date(a,b-1,c).getTime()/864e5)};
function daily(){const D=PREF.daily,t=today();if(D.date!==t){const r=seeded(dayNum(t)*7+3);const pool=MISSIONS;const pick=[];
    while(pick.length<3){const m=pool[Math.floor(r()*pool.length)];if(!pick.includes(m.id))pick.push(m.id)}D.date=t;D.list=pick;D.done={};D.best={};D.bonus=false;savePref()}return D}
function missionScan(final,winner){if(!trackable())return;const D=daily();const hum=G.players.filter(p=>!p.ai&&(!G.online||p.uid===NET.me));if(!hum.length)return;
  D.list.forEach(id=>{if(D.done[id])return;const m=MISSIONS.find(x=>x.id===id);let v=0;
    if(m.end){if(!final)return;v=m.win?(winner&&hum.includes(winner)?1:0):m.away?(PREF.lastCountry&&countryOf(cityNow()).key!==PREF.lastCountry?1:0):1}else v=Math.max(...hum.map(p=>m.f(p)||0));
    D.best[id]=Math.max(D.best[id]||0,v);if(v>=m.g){D.done[id]=1;streakMark();achQ.push({name:'Daily mission: '+loc(m.n),xp:MISSION_XP,coins:MISSION_COINS,daily:1});addXP(MISSION_XP,'Daily: '+loc(m.n));addCoins(MISSION_COINS);achShow()}});
  if(!D.bonus&&D.list.every(id=>D.done[id])){D.bonus=true;achQ.push({name:'All daily missions done!',xp:250,coins:60,daily:1});addXP(250,'Daily bonus');addCoins(60,'Daily bonus');achShow()}savePref()}
function streakMark(){const D=PREF.daily,t=today();if(D.streakDay===t)return;D.streak=(D.streakDay&&dayNum(t)-dayNum(D.streakDay)===1)?(D.streak||0)+1:1;D.streakDay=t;PREF.stats.streakBest=Math.max(PREF.stats.streakBest||0,D.streak);const b=Math.min(500,50*D.streak);if(D.streak>1){achQ.push({name:`${D.streak}-day streak 🔥`,xp:b,coins:Math.min(100,10*D.streak),daily:1});addXP(b,`${D.streak}-day streak`);addCoins(Math.min(100,10*D.streak))}achBump()}
function streakNow(){const D=PREF.daily;if(!D.streakDay)return 0;return dayNum(today())-dayNum(D.streakDay)<=1?D.streak||0:0}

const PROMOS=[{h:'3eb64b641a84925181c72446845c5e300a9e2d75cb27bd64276c2b74fe286ba5',coins:20000,until:Date.UTC(2026,9,27,20,13),label:'20,000 coins'}];
function sha256hex(str){const K=[],H=[];let p=2;for(let n=0;n<64;p++){let ok=true;for(let d=2;d*d<=p;d++)if(p%d===0){ok=false;break}if(ok){if(n<8)H[n]=(Math.pow(p,1/2)%1)*4294967296|0;K[n++]=(Math.pow(p,1/3)%1)*4294967296|0}}
  const b=unescape(encodeURIComponent(str)),w=[],l=b.length*8;for(let i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);w[l>>5]|=0x80<<(24-l%32);w[((l+64>>9)<<4)+15]=l;
  const r=(x,n)=>x>>>n|x<<(32-n);for(let j=0;j<w.length;j+=16){const W=Array.from({length:16},(_,k)=>w[j+k]|0);let[a,bb,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){if(i>15){const x=W[i-15],y=W[i-2];W[i]=(W[i-16]+(r(x,7)^r(x,18)^x>>>3)+W[i-7]+(r(y,17)^r(y,19)^y>>>10))|0}
    const t1=(h+(r(e,6)^r(e,11)^r(e,25))+(e&f^~e&g)+K[i]+(W[i]|0))|0,t2=((r(a,2)^r(a,13)^r(a,22))+(a&bb^a&c^bb&c))|0;h=g;g=f;f=e;e=d+t1|0;d=c;c=bb;bb=a;a=t1+t2|0}
    H[0]=H[0]+a|0;H[1]=H[1]+bb|0;H[2]=H[2]+c|0;H[3]=H[3]+d|0;H[4]=H[4]+e|0;H[5]=H[5]+f|0;H[6]=H[6]+g|0;H[7]=H[7]+h|0}
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
async function redeemPromo(raw){const n=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(n.length<4)return{ok:false,msg:'Enter a code.'};
  const h=sha256hex('skyline:'+n),P=PROMOS.find(x=>x.h===h);if(!P)return{ok:false,msg:'That code isn’t valid.'};
  PREF.promos=PREF.promos||{};if(PREF.promos[h])return{ok:false,msg:'You’ve already redeemed this code.'};if(Date.now()>P.until)return{ok:false,msg:'This code has expired.'};

/* daily picks: fixed for the whole local day, chosen from items the player didn't own that morning */
function dailyKey(){const d=new Date();return d.getFullYear()*1e4+(d.getMonth()+1)*100+d.getDate()}
function dailyPicks(){const key=dailyKey();if(PREF.dshop&&PREF.dshop.key===key)return PREF.dshop;
  const r=seeded(key*7+11),pool=[];['surr','fin','dice'].forEach(k=>itemList(k).forEach(it=>{if(it.price>0)pool.push([k,it.id])}));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const un=pool.filter(([k,id])=>!itemOwned(k,id)),list=un.concat(pool.filter(x=>!un.includes(x))).slice(0,6);

  if(k==='block'){const was=isBlocked(s.uid);PREF.blocked=(PREF.blocked||[]).filter(b=>b.u!==s.uid);if(!was)PREF.blocked.push({u:s.uid,n:nm});savePref();toast(was?`${nm} is unblocked`:`${nm} is blocked`);return}

function camFocus(pos){const r=rect(pos);const X=r.x+r.w/2,Y=r.y+r.h/2;const dx=550-X,dy=550-Y,l=Math.hypot(dx,dy)||1;const a=aspect();
  camGoal([wx(X)+dx/l*.7,0,wz(Y)+dy/l*.7],-sideOf(pos)*Math.PI/2,a<1?8:5.4,.74,3.2);userCam=1}

  camFocus(p.pos);highlight(p.pos);toast(p.inJail?`${p.name} is in ${SQ[10].n}`:`${p.name} is on ${SQ[p.pos].n}`);sfx('tap')}
let mapZoom=1;
const forSale=()=>G?SQ.reduce((n,_,i)=>n+(buyable(i)&&G.own[i].o<0?1:0),0):0;
function mapCellHTML(i,k,cp){const s=SQ[i],r=rect(i),sd=sideOf(i),cw=CW*k,fs=Math.max(5.5,cw*.15);
  const o=buyable(i)?G.own[i]:null,own=o&&o.o>=0?P(o.o):null;
  const toks=G.players.filter(p=>!p.bankrupt&&p.pos===i).map(p=>`<i class="${cp&&p.id===cp.id?'now':''}${p.inJail?' jl':''}" style="--pc:${p.col}">${p.tok}</i>`).join('');
  let band='';if(s.g){const B=Math.max(3,cw*.16);band=`<span class="band" style="--g:${GC[s.g]};${[`left:0;right:0;top:0;height:${B}px`,`top:0;bottom:0;right:0;width:${B}px`,`left:0;right:0;bottom:0;height:${B}px`,`top:0;bottom:0;left:0;width:${B}px`][sd]}"></span>`}
  const ic={go:'🏁',jail:'🔒',free:'🅿️',gojail:'👮',chance:'❓',esusu:'💰',tax:'🧾'}[s.t]||s.ic||'';
  const hs=o&&o.h?(o.h===5?'<span class="hs ht">🏨</span>':`<span class="hs">${'●'.repeat(o.h)}</span>`):'';
  const bg=own?`background-color:${own.col}2e;`:'';
  const big=cw>=40,sale=o&&o.o<0;
  return `<div class="mc${o&&o.m?' mo':''}${sale?' fs':''}" role="button" tabindex="0" data-i="${i}" style="left:${r.x*k}px;top:${r.y*k}px;width:${r.w*k}px;height:${r.h*k}px;--fs:${fs}px;${bg}">${band}${ic&&!toks?`<span class="ic">${ic}</span>`:''}${big||(!ic&&!toks&&!hs)?`<span class="nm">${esc(s.n)}</span>`:''}${hs}${toks?`<span class="tks">${toks}</span>`:''}${own?`<span class="ow" style="--oc:${own.col}" title="${esc(own.name)}"></span>`:''}</div>`}
function drawMap(pn){const W=pn.querySelector('.mapwrap'),B=pn.querySelector('.mapbd');if(!W||!G)return;
  const base=Math.max(220,Math.min(W.clientWidth,W.clientHeight)-12),S=Math.round(base*mapZoom),k=S/1100,cp=G.over?null:P(G.turn),fs=Math.max(5.5,CW*k*.15);
  B.style.width=S+'px';B.style.height=S+'px';
  let h='';for(let i=0;i<40;i++)h+=mapCellHTML(i,k,cp);
  h+=`<div class="mcen" style="left:${C*k}px;top:${C*k}px;width:${(1100-2*C)*k}px;height:${(1100-2*C)*k}px;--fs:${fs}px"><b>${esc(CITY.name)}</b><span>${'Round '+G.round}${cp?' · '+`${esc(cp.name)}’s turn`:' · '+'Game over'}</span><span>${`🏷️ ${forSale()} for sale`}</span><span>${`🏠 ${G.houses} houses left`} · ${`🏨 ${G.hotels} hotels left`}</span><small>Tap a square for details. Double-tap a player on the left to see where their token is.</small></div>`;
  B.innerHTML=h;
  B.querySelectorAll('.mc').forEach(c=>{const go=()=>showSquare(+c.dataset.i);c.onclick=go;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
  pn.querySelector('#mapH').textContent=`🏠 ${G.houses} houses left`;pn.querySelector('#mapS').textContent=`🏷️ ${forSale()} for sale`;pn.querySelector('#mapT').textContent=`🏨 ${G.hotels} hotels left`}
async function openMap(){if(!G||$('#modals').children.length)return;sfx('tap');let iv=0;
  await modal({cls:'wide mapm',html:`<div class="maphd"><div class="mh">Map</div><span class="chip" id="mapS"></span><span class="chip" id="mapH"></span><span class="chip" id="mapT"></span><button class="btn" id="mapZ">${mapZoom>1?'🔍 Zoom out':'🔍 Zoom in'}</button><button class="btn mapx" id="mapX" aria-label="Close the map">✕</button></div><div class="mapwrap"><div class="mapbd"></div></div>`,
    btns:[],onMount:(pn,close)=>{pn.querySelector('#mapX').onclick=()=>close('x');
      const draw=()=>drawMap(pn);const ro=()=>draw();requestAnimationFrame(draw);
      pn.querySelector('#mapZ').onclick=e=>{const W=pn.querySelector('.mapwrap');const cx=(W.scrollLeft+W.clientWidth/2)/W.scrollWidth,cy=(W.scrollTop+W.clientHeight/2)/W.scrollHeight;
        mapZoom=mapZoom>1?1:2.4;e.target.textContent=mapZoom>1?'🔍 Zoom out':'🔍 Zoom in';draw();W.scrollLeft=cx*W.scrollWidth-W.clientWidth/2;W.scrollTop=cy*W.scrollHeight-W.clientHeight/2};
      let last='';iv=setInterval(()=>{if(!pn.isConnected){clearInterval(iv);removeEventListener('resize',ro);return}const sig=JSON.stringify([G.turn,G.houses,G.hotels,G.players.map(p=>[p.pos,p.bankrupt,p.inJail]),G.own.map(o=>[o.o,o.h,o.m])]);if(sig!==last){last=sig;draw()}},700);
      addEventListener('resize',ro)}});
  clearInterval(iv)}
