<script type="module">

import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  const g = await loader.loadAsync(url);

  const key = new THREE.DirectionalLight(0xfff1dc, 2.2); key.position.set(2, 3, 3); scene.add(key);
  const rim = new THREE.DirectionalLight(0x6fd8ff, 2.0); rim.position.set(-3, 2, -2); scene.add(rim);
  const rim2 = new THREE.DirectionalLight(0xff5fe0, 1.0); rim2.position.set(3, 1, -3); scene.add(rim2);
