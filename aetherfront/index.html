<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<title>AETHERFRONT: LAST LINE</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />

<body>
<div id="app">
  <section id="screen-home" class="screen portrait" aria-label="Home"></section>
  <section id="screen-squads" class="screen portrait" aria-label="Squads and collection"></section>
  <section id="screen-battle" class="screen landscape" aria-label="Battle">
    <div id="battle-host"></div>
    <div id="battle-ui"></div>
  </section>
  <div id="modal" class="hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" aria-live="polite"></div>
  <div id="rotate" class="hidden">
    <div class="rotate-card"><div class="phone-icon"></div><h2>Rotate to landscape</h2><p>Battles are designed for landscape. Turn your phone sideways.</p><button class="btn ghost" data-act="rotate-ignore">Continue anyway</button></div>
  </div>
  <div id="boot"><div class="boot-logo"><span class="a-mark"></span><b>AETHERFRONT:</b> <i>LAST LINE</i></div><div class="boot-bar"><i id="boot-fill"></i></div><small id="boot-msg">Loading assets…</small></div>
</div>
